# This repo is public and every credential in it is supposed to be sealed.
# Two guards: gitleaks for credential shapes anywhere in history, and a
# repo-specific check that no plaintext Secret or key file ever lands here.

name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '13 5 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a secret committed and later removed is still a leak.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unsealed:
    name: no plaintext secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: reject plaintext Secret manifests
        run: |
          set -euo pipefail
          # Every credential here goes in as a SealedSecret. A bare
          # `kind: Secret` means kubeseal was skipped — the data is base64,
          # which is not encryption, and this repo is public.
          if hits=$(git grep -n -E '^[[:space:]]*kind:[[:space:]]*Secret[[:space:]]*$' -- '*.yaml' '*.yml'); then
            echo "::error::plaintext Secret manifest committed — seal it with kubeseal and rotate the credential"
            echo "$hits"
            exit 1
          fi
          echo "no plaintext Secret manifests"

      - name: reject credential files
        run: |
          set -euo pipefail
          # Shapes that are never legitimately committed here. local-only/ is
          # gitignored, but an accidental `git add -f` walks straight past that.
          if hits=$(git ls-files | grep -E '(^|/)(kubeconfig|\.kube/config|id_[rd]sa|\.env)$|\.(pem|key|p12|pfx|kubeconfig)$'); then
            echo "::error::credential-shaped file committed"
            echo "$hits"
            exit 1
          fi
          echo "no credential files tracked"

# A finding means the credential is burned. Rotate it first, then clean the
# history — in that order. Rewriting history does not un-publish anything.
#
# False positives go in .gitleaks.toml with a comment saying why, never in an
# inline allowlist comment that outlives the reason for it.
