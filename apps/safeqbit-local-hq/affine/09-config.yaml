# apps/safeqbit-local-hq/affine/09-config.yaml
# AFFiNE's config.json, which 0.27 made the preferred configuration source.
#
# Only ONE setting had to move here. Upstream's own 0.27.4 compose still sets
# DATABASE_URL, REDIS_SERVER_HOST and AFFINE_INDEXER_ENABLED as environment
# variables, and the config schema still annotates server.https with
# `@environment AFFINE_SERVER_HTTPS`, so those all stay in the Deployment.
# server.externalUrl is the exception: it has no @environment annotation, so
# AFFINE_SERVER_EXTERNAL_URL is genuinely no longer read and this is the only
# place the value can now live.
#
# It matters more than it looks. externalUrl is what AFFiNE generates outbound
# links against — invite emails, OAuth callbacks, share links. Wrong or empty,
# the app still starts and mostly works, and the breakage shows up later and
# somewhere else.
#
# oauth.providers.oidc.allowPrivateNetwork exists because 0.27 added an SSRF
# guard that refuses to fetch an OIDC issuer resolving to a private address.
# Ours is authentik at authentik01.local.safeqbit.com -> 10.10.13.50, so on
# 0.27.4 the provider failed validation and unregistered itself: serverConfig
# went from features ["Comment","OAuth"] to ["Comment"] with oauthProviders [],
# which locked both users out of SSO (both have oidc connected accounts). The
# guard is right in general and wrong for a LAN-only issuer, and this is the
# opt-out upstream names in the error itself.
#
# The rest of the OIDC provider config — issuer, clientId, clientSecret — is
# deliberately NOT here. It is admin-UI state in the app_configs table, which
# is where it belongs given it holds a client secret.
#
# Mounted with subPath so it lands as a single file INSIDE the config PVC's
# mount point rather than replacing it. That directory also holds private.key,
# the server's generated identity, which must survive — mounting the ConfigMap
# at the directory would hide it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: affine-config
  namespace: affine
data:
  config.json: |
    {
      "server": {
        "externalUrl": "https://affine.local.safeqbit.com"
      },
      "oauth": {
        "providers": {
          "oidc": {
            "allowPrivateNetwork": true
          }
        }
      }
    }
