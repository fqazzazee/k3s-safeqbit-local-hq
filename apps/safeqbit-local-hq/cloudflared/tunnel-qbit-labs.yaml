# apps/safeqbit-local-hq/cloudflared/tunnel-qbit-labs.yaml
# All Kubernetes resources for the qbit-labs-cf-tunnel Cloudflare tunnel.
# Routing rules live in the Cloudflare Zero Trust dashboard.
# Same pattern as tunnel-passzilla.yaml.
#
# Origin (dashboard → Public hostname → Service):
#   http://qbit-labs.qbit-labs.svc.cluster.local:3000
#
# ── qbit-labs has NO login ────────────────────────────────────────────────
# Anyone who reaches it can read the labs and change progress (upstream
# docs/DECISIONS.md, "No authentication in v1"). The public hostname MUST
# sit behind a Cloudflare Access application (Zero Trust → Access →
# Applications) BEFORE the hostname is added to this tunnel. That gate lives
# only in the dashboard, so nothing in this repo enforces it.
# See workbook/qbit-labs.md, "Security posture".

---
# ── 1 · SealedSecret ──────────────────────────────────────────────────────────
# Token sealed on 2026-10-29 with kubeseal v0.36.6 against
# sealed-secrets-controller v0.40.0 in kube-system.
# To re-seal (e.g. after a key rotation):
#
#   kubectl create secret generic qbit-labs-cf-tunnel-token \
#     --namespace cloudflared \
#     --from-literal=token='<TOKEN>' \
#     --dry-run=client -o yaml \
#   | kubeseal \
#       --controller-name  sealed-secrets-controller \
#       --controller-namespace kube-system \
#       --format yaml \
#   > /tmp/qbit-labs-sealed.yaml && grep "token:" /tmp/qbit-labs-sealed.yaml

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: qbit-labs-cf-tunnel-token
  namespace: cloudflared
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: qbit-labs-cf-tunnel-token
      namespace: cloudflared
    type: Opaque

---
# ── 2 · Deployment ────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbit-labs-cf-tunnel
  namespace: cloudflared
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: qbit-labs-cf-tunnel
  template:
    metadata:
      labels:
        app: qbit-labs-cf-tunnel
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: qbit-labs-cf-tunnel
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.3
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: qbit-labs-cf-tunnel-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30

---
# ── 3 · Service (metrics only) ────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: qbit-labs-cf-tunnel-metrics
  namespace: cloudflared
  labels:
    app: qbit-labs-cf-tunnel
spec:
  clusterIP: None
  selector:
    app: qbit-labs-cf-tunnel
  ports:
    - name: metrics
      port: 2000
      targetPort: metrics
      protocol: TCP

---
# ── 4 · ServiceMonitor ────────────────────────────────────────────────────────

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qbit-labs-cf-tunnel
  namespace: cloudflared
  labels:
    app: qbit-labs-cf-tunnel
    release: monitoring
spec:
  selector:
    matchLabels:
      app: qbit-labs-cf-tunnel
  namespaceSelector:
    matchNames:
      - cloudflared
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

---
# ── 5 · PodDisruptionBudget ───────────────────────────────────────────────────

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qbit-labs-cf-tunnel
  namespace: cloudflared
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: qbit-labs-cf-tunnel
