# 06-gickup-tokens.sealed.yaml
# Tokens for the gickup CronJob (07-gickup-cronjob.yaml), mounted at /secrets:
#   github-fqazzazee  fine-grained PAT, owner fqazzazee, all repos,
#                     Contents: Read-only (+ Metadata)
#   github-zonduit    same, owner Zonduit
#   forgejo           API token "gickup" of forgejo-admin
#                     (write:repository, write:organization, read:user, write:admin)
#
# The GitHub PATs are also what each mirror was CREATED with: Forgejo stores
# a copy per mirror, encrypted in its DB. Re-sealing this file alone does NOT
# update existing mirrors. Rotation procedure: workbook/forgejo.md,
# "Where the mirror credentials live, and rotating them".
#
# Re-seal: workbook/maintenance.md "Sealed Secrets" with
#   kubectl create secret generic gickup-tokens -n forgejo \
#     --from-file=github-fqazzazee=… --from-file=github-zonduit=… \
#     --from-file=forgejo=… --dry-run=client -o yaml | kubeseal --cert … --format yaml
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gickup-tokens
  namespace: forgejo
spec:
  encryptedData:
    forgejo: 
    github-fqazzazee: 
    github-zonduit: 
  template:
    metadata:
      name: gickup-tokens
      namespace: forgejo
