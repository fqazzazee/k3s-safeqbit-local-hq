# CloudNativePG cluster backing Apache Guacamole.
#
# This Postgres database IS the demo's credential vault: Guacamole stores user
# accounts, connection definitions, session history, and the per-connection
# RDP/VNC/SSH credentials here. Credentials are injected into sessions by guacd
# at connect time and never shown to the end user.
#
# instances: 1 — this is a dev/demo workload, so a single instance is fine
# (see workbook/cnpg-strategy.md for the instance-count rationale; production
# auth-path workloads like authentik run 2). Bump to 2 if this graduates.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: guacamole-cnpg
  namespace: guacamole
spec:
  instances: 1

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      # WAL ring sizing (added 2026-08-17). CNPG's defaults —
      # wal_keep_size=512MB, max_wal_size=1GB — pinned pg_wal at ~561MB on every
      # cluster in this fleet while the actual `base/` dir was only 33-245MB.
      # Velero snapshots these PVCs whole, so ~90% of every CNPG backup shipped
      # to B2 was empty WAL ring. These values shrink pg_wal to ~150-200MB.
      #
      # Safe here because replicationSlots.highAvailability is on by default:
      # standbys hold their own slot, so wal_keep_size is only belt-and-braces
      # for slotless catch-up. These are sighup parameters — CNPG applies them
      # with a config reload, no Postgres restart and no failover.
      #
      # Lower max_wal_size means more frequent checkpoints; negligible on these
      # low-write DBs. Revisit if a cluster ever becomes write-heavy.
      max_wal_size: "256MB"
      min_wal_size: "80MB"
      wal_keep_size: "128MB"

  bootstrap:
    initdb:
      database: guacamole
      owner: guacamole

  storage:
    storageClass: longhorn
    size: 5Gi

  backup:
    volumeSnapshot:
      className: longhorn-velero
      snapshotOwnerReference: backup

  affinity:
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
