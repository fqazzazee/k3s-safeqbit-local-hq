# apps/safeqbit-local-hq/kustomization.yaml
# Top-level list of every app on the safeqbit-local-hq cluster. As you add
# apps, add them to the resources: list. Each entry is a relative path to a
# directory containing its own kustomization.yaml.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - vaultwarden
  - authentik
  - passzilla
  - netbox
  - affine
  - immich
  - photoprism
  - cloudflared
  - uptime-kuma
  # Disabled 2026-08-29 — decommissioned (namespace deleted by hand; this
  # layer is prune:false so removing it here only orphans, never deletes).
  # Manifests kept in guacamole/ so it can be redeployed by uncommenting.
  # - guacamole
  - pulse
  - home-assistant
  # Brings its own edge (Gerbil + Traefik in one pod, on its own MetalLB IP)
  # rather than going through ingress-nginx — see workbook/pangolin.md.
  - pangolin
  # Zero-dependency Node app with no upstream image: the pod clones a pinned
  # commit at start and runs it on stock node:alpine. LAN-only, no auth.
  - babytracker
  # When you add Linkding or other apps later, append them here:
  # - linkding
  # - paperless-ngx
  # - homepage
