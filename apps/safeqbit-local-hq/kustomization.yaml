# apps/safeqbit-local-hq/kustomization.yaml
# Top-level list of every app on the safeqbit-local-hq cluster. As you add
# apps, add them to the resources: list. Each entry is a relative path to a
# directory containing its own kustomization.yaml.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - vaultwarden
  - authentik
  - passzilla
  - netbox
  - affine
  - immich
  - photoprism
  - cloudflared
  - uptime-kuma
  - guacamole
  - pulse
  - home-assistant
  # Pangolin was removed 2026-06-18 and redeployed 2026-08-10 as hand-authored
  # manifests. The blocker then was the split topology k3s seemed to force; it
  # is gone now that Gerbil and Traefik share one pod (upstream's
  # `network_mode: service:gerbil`) behind one mixed TCP/UDP LoadBalancer.
  # See workbook/pangolin.md.
  - pangolin
  # When you add Linkding or other apps later, append them here:
  # - linkding
  # - paperless-ngx
  # - homepage
