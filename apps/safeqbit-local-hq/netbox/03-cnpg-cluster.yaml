# 03-cnpg-cluster.yaml
# CNPG Cluster for Netbox's PostgreSQL database.
#
# The operator (in cnpg-system) creates:
#   - netbox-cnpg-1 pod (Postgres 16)
#   - Three services: netbox-cnpg-rw, netbox-cnpg-ro, netbox-cnpg-r
#   - Secret netbox-cnpg-app with the app user credentials
#
# instances: 2 — primary + 1 standby. Survives a single-node loss without
# the multi-minute pg_basebackup window a single-instance cluster needs to
# recover. Cost: a second 5Gi PVC (~15Gi after Longhorn replicas).

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbox-cnpg
  namespace: netbox
spec:
  instances: 2

  postgresql:
    parameters:
      # WAL ring sizing (added 2026-08-17). CNPG's defaults —
      # wal_keep_size=512MB, max_wal_size=1GB — pinned pg_wal at ~561MB on every
      # cluster in this fleet while the actual `base/` dir was only 33-245MB.
      # Velero snapshots these PVCs whole, so ~90% of every CNPG backup shipped
      # to B2 was empty WAL ring. These values shrink pg_wal to ~150-200MB.
      #
      # Safe here because replicationSlots.highAvailability is on by default:
      # standbys hold their own slot, so wal_keep_size is only belt-and-braces
      # for slotless catch-up. These are sighup parameters — CNPG applies them
      # with a config reload, no Postgres restart and no failover.
      #
      # Lower max_wal_size means more frequent checkpoints; negligible on these
      # low-write DBs. Revisit if a cluster ever becomes write-heavy.
      max_wal_size: "256MB"
      min_wal_size: "80MB"
      wal_keep_size: "128MB"

  bootstrap:
    initdb:
      database: netbox
      owner: netbox

  storage:
    storageClass: longhorn
    size: 5Gi

  backup:
    volumeSnapshot:
      className: longhorn-velero
      snapshotOwnerReference: backup

  affinity:
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
