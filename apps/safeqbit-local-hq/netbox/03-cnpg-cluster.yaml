# 03-cnpg-cluster.yaml
# CNPG Cluster for Netbox's PostgreSQL database.
#
# The operator (in cnpg-system) creates:
#   - netbox-cnpg-1 pod (Postgres 16)
#   - Three services: netbox-cnpg-rw, netbox-cnpg-ro, netbox-cnpg-r
#   - Secret netbox-cnpg-app with the app user credentials
#
# instances: 2 — primary + 1 standby. Survives a single-node loss without
# the multi-minute pg_basebackup window a single-instance cluster needs to
# recover. Cost: a second 5Gi PVC (~15Gi after Longhorn replicas).

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbox-cnpg
  namespace: netbox
spec:
  instances: 2

  postgresql:
    parameters:
      # WAL ring sizing. CNPG's defaults (wal_keep_size=512MB, max_wal_size=1GB)
      # pin pg_wal at ~561MB whatever the DB size, and Velero snapshots the whole
      # PVC — so most of each backup was empty ring. These settle it at ~209MB.
      # Both are sighup params: applied by config reload, no restart, no
      # failover. Safe because HA replication slots protect the standbys.
      max_wal_size: "256MB"
      min_wal_size: "80MB"
      wal_keep_size: "128MB"

  bootstrap:
    initdb:
      database: netbox
      owner: netbox

  storage:
    storageClass: longhorn
    size: 5Gi

  backup:
    volumeSnapshot:
      className: longhorn-velero
      snapshotOwnerReference: backup

  affinity:
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
