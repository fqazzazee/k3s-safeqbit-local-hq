# 08-manage.yaml
# Suspended CronJob — never scheduled. It exists as the TEMPLATE for one-off
# `manage.py` runs, because it already carries the full DB/Redis/secret env
# and needs no volumes:
#
#   kubectl -n netbox create job --from=cronjob/netbox-manage netbox-manage-once
#       (runs the default `manage.py check`), or with a real command:
#   kubectl -n netbox get cronjob netbox-manage -o json \
#     | jq '.spec.jobTemplate.spec.template.spec.containers[0].command[2:] = ["<cmd>", "<args>"]
#           | {apiVersion: "batch/v1", kind: "Job",
#              metadata: {name: "netbox-manage-once", namespace: "netbox"},
#              spec: .spec.jobTemplate.spec}' \
#     | kubectl apply -f -
#   (delete the Job afterwards)
#
# NEVER `kubectl exec deploy/netbox -- manage.py ...` instead: it starts a
# second Django process inside the web container's 1Gi cgroup, next to the
# Granian workers, and OOM-kills NetBox (2026-09-22).
#
# HISTORY: this was a daily `manage.py housekeeping` CronJob. NetBox v4.4
# moved housekeeping into a built-in daily system job ("System Housekeeping",
# run by netbox-worker — check core_job), and v4.7 removed the command, so the
# 2026-09-23 00:30 run failed with "Unknown command: 'housekeeping'". The
# CronJob was renamed and suspended rather than deleted so this template
# survives. Every layer is prune:false, so the old netbox-housekeeping object
# had to be deleted by hand after the rename merged.
#
# SKIP_SUPERUSER: true because this pod never needs to create a superuser.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: netbox-manage
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: manage
spec:
  suspend: true
  # Required by the API even while suspended; never fires.
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Hard stop so a hung command cannot sit Active forever.
      activeDeadlineSeconds: 900
      # One-off admin commands must not be silently retried.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: netbox
            app.kubernetes.io/component: manage
        spec:
          restartPolicy: Never
          containers:
            - name: manage
              image: netboxcommunity/netbox:v4.7.1-5.1.1
              command:
                - /opt/netbox/venv/bin/python
                - /opt/netbox/netbox/manage.py
                - check
              env:
                - name: DB_HOST
                  value: netbox-cnpg-rw
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: netbox
                - name: DB_USER
                  value: netbox
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: netbox-cnpg-app
                      key: password

                - name: REDIS_HOST
                  value: netbox-redis-tasks
                - name: REDIS_PORT
                  value: "6379"
                - name: REDIS_DATABASE
                  value: "0"
                - name: REDIS_SSL
                  value: "false"
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: netbox-credentials
                      key: redis-password

                - name: REDIS_CACHE_HOST
                  value: netbox-redis-cache
                - name: REDIS_CACHE_PORT
                  value: "6379"
                - name: REDIS_CACHE_DATABASE
                  value: "1"
                - name: REDIS_CACHE_SSL
                  value: "false"
                - name: REDIS_CACHE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: netbox-credentials
                      key: redis-cache-password

                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: netbox-credentials
                      key: secret-key
                - name: ALLOWED_HOSTS
                  value: "netbox.local.safeqbit.com"
                - name: TIME_ZONE
                  value: "America/New_York"
                - name: SKIP_SUPERUSER
                  value: "true"

              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  # A NetBox 4.7 Django process is ~270Mi resident.
                  memory: 512Mi
