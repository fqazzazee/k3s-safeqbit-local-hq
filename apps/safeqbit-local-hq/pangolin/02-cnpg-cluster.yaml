# CloudNativePG cluster backing Pangolin.
#
# Pangolin stores all of its state here: orgs, users, sites, resources, access
# policies, sessions, and the EE license registration. Postgres is upstream's
# recommended backend (sqlite is the single-container default and is dev-scale).
#
# instances: 1 — homelab/internal workload, matching the guacamole rationale
# (see workbook/cnpg-strategy.md). Bump to 2 if Pangolin becomes a critical
# auth path. CNPG auto-creates the `pangolin-cnpg-app` Secret; the Pangolin
# Deployment consumes its `uri` key as POSTGRES_CONNECTION_STRING.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pangolin-cnpg
  namespace: pangolin
spec:
  instances: 1

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      # WAL ring sizing (added 2026-08-17). CNPG's defaults —
      # wal_keep_size=512MB, max_wal_size=1GB — pinned pg_wal at ~561MB on every
      # cluster in this fleet while the actual `base/` dir was only 33-245MB.
      # Velero snapshots these PVCs whole, so ~90% of every CNPG backup shipped
      # to B2 was empty WAL ring. Measured after the 2026-08-17 rollout: pg_wal
      # settles at 209MB (128MB keep + headroom + in-flight = 13 x 16MB segs),
      # taking total pgdata from 3.85GB to 1.74GB across the six clusters.
      #
      # Safe here because replicationSlots.highAvailability is on by default:
      # standbys hold their own slot, so wal_keep_size is only belt-and-braces
      # for slotless catch-up. These are sighup parameters — CNPG applies them
      # with a config reload, no Postgres restart and no failover.
      #
      # Lower max_wal_size means more frequent checkpoints; negligible on these
      # low-write DBs. Revisit if a cluster ever becomes write-heavy.
      max_wal_size: "256MB"
      min_wal_size: "80MB"
      wal_keep_size: "128MB"

  bootstrap:
    initdb:
      database: pangolin
      owner: pangolin

  storage:
    storageClass: longhorn
    size: 5Gi

  backup:
    volumeSnapshot:
      className: longhorn-velero
      snapshotOwnerReference: backup

  affinity:
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
