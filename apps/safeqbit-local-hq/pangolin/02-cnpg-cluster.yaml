# CloudNativePG cluster backing Pangolin.
#
# Pangolin stores all of its state here: orgs, users, sites, resources, access
# policies, sessions, and the EE license registration. Postgres is upstream's
# recommended backend (sqlite is the single-container default and is dev-scale).
#
# instances: 1 — homelab/internal workload, matching the guacamole rationale
# (see workbook/cnpg-strategy.md). Bump to 2 if Pangolin becomes a critical
# auth path. CNPG auto-creates the `pangolin-cnpg-app` Secret; the Pangolin
# Deployment consumes its `uri` key as POSTGRES_CONNECTION_STRING.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pangolin-cnpg
  namespace: pangolin
spec:
  instances: 1

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      # WAL ring sizing. CNPG's defaults (wal_keep_size=512MB, max_wal_size=1GB)
      # pin pg_wal at ~561MB whatever the DB size, and Velero snapshots the whole
      # PVC — so most of each backup was empty ring. These settle it at ~209MB.
      # Both are sighup params: applied by config reload, no restart, no
      # failover. Safe because HA replication slots protect the standbys.
      max_wal_size: "256MB"
      min_wal_size: "80MB"
      wal_keep_size: "128MB"

  bootstrap:
    initdb:
      database: pangolin
      owner: pangolin

  storage:
    storageClass: longhorn
    size: 5Gi

  backup:
    volumeSnapshot:
      className: longhorn-velero
      snapshotOwnerReference: backup

  affinity:
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
