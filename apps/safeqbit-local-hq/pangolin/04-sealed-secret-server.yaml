# Pangolin's SERVER_SECRET — used to sign sessions and encrypt stored secrets.
#
# Pre-generated and sealed rather than left to the app so it NEVER rotates:
# rotating it invalidates every session and breaks stored encrypted values.
# Pangolin reads it from the SERVER_SECRET env var when `server.secret` is
# absent from config.yml (server/lib/readConfigFile.ts), which is why the
# ConfigMap in 06 deliberately omits that key.
#
# Regenerate (only if you accept the blast radius above):
#   SS=$(openssl rand -base64 48 | tr -d '\n=+/' | cut -c1-32)
#   kubectl create secret generic pangolin-server-secret -n pangolin \
#     --from-literal=SERVER_SECRET="$SS" --dry-run=client -o yaml \
#   | kubeseal --controller-name=sealed-secrets-controller \
#       --controller-namespace=kube-system --format yaml \
#   > 04-sealed-secret-server.yaml; unset SS
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pangolin-server-secret
  namespace: pangolin
spec:
  encryptedData:
    SERVER_SECRET: 
  template:
    metadata:
      name: pangolin-server-secret
      namespace: pangolin
