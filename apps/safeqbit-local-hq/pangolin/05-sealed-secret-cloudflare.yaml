# Cloudflare API token for the edge Traefik's ACME DNS-01 challenge.
#
# local.safeqbit.com resolves only to private IPs, so HTTP-01 cannot work —
# Let's Encrypt has to validate via a DNS TXT record. This is the SAME token
# cert-manager already uses (zone safeqbit.com), re-sealed for this namespace.
#
# Reseal (no plaintext is printed):
#   CF=$(kubectl get secret cloudflare-api-token -n cert-manager \
#        -o jsonpath='{.data.api-token}' | base64 -d)
#   kubectl create secret generic pangolin-traefik-cloudflare -n pangolin \
#     --from-literal=email=fadi@safeqbit.com \
#     --from-literal=dnsApiToken="$CF" --from-literal=zoneApiToken="$CF" \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-name=sealed-secrets-controller \
#       --controller-namespace=kube-system --format yaml \
#   > 05-sealed-secret-cloudflare.yaml; unset CF
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pangolin-traefik-cloudflare
  namespace: pangolin
spec:
  encryptedData:
    dnsApiToken: 
    email: 
    zoneApiToken: 
  template:
    metadata:
      name: pangolin-traefik-cloudflare
      namespace: pangolin
