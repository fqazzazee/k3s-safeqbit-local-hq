# Pangolin's config.yml, adapted from upstream's installer template
# (fosrl/pangolin @1.21.1, install/config/config.yml).
#
# Two keys are DELIBERATELY absent and injected as env vars instead, so no
# secret ever lands in Git or in a ConfigMap:
#   - server.secret            -> SERVER_SECRET               (04, sealed)
#   - postgres.connection_string -> POSTGRES_CONNECTION_STRING (CNPG's own
#     `pangolin-cnpg-app` Secret, key `uri`)
# Both fallbacks are real upstream behaviour, not a hack:
# readConfigFile.ts assigns `data.server.secret = process.env.SERVER_SECRET`
# when the key is missing, and db/pg/driver.ts checks
# POSTGRES_CONNECTION_STRING *before* the config file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pangolin-config
  namespace: pangolin
data:
  config.yml: |
    gerbil:
        start_port: 51820
        clients_start_port: 21820
        # The address every Newt/Olm client dials for WireGuard. A HOSTNAME, not
        # an IP, and deliberately so:
        #
        #   - On the LAN it resolves (Cloudflare) to 10.10.13.52, the MetalLB IP
        #     of the edge Service, where both Traefik (:80/:443) and Gerbil
        #     (:51820/:21820 udp) live because they share one pod netns.
        #   - INSIDE the cluster, the Newt pod overrides it via hostAliases to
        #     the edge's pinned ClusterIP, so it reaches the edge as ordinary
        #     pod-to-Service traffic instead of leaving for a LoadBalancer IP
        #     that belongs to its own cluster. Newt resolves this name itself at
        #     connect time (util.ResolveDomain -> net.LookupIP on a
        #     CGO_ENABLED=0 binary, so /etc/hosts wins), which is what makes the
        #     override possible. See 14-newt-deployment.yaml.
        #
        # This is the zone apex, so it is NOT covered by *.pg.local.safeqbit.com
        # — the edge certificate carries it as an explicit SAN. See 10-edge-config.
        base_endpoint: "pg.local.safeqbit.com"

    app:
        dashboard_url: "https://pangolin.pg.local.safeqbit.com"
        log_level: "info"
        # Off to match the cluster's privacy posture (cf. authentik error reporting).
        telemetry:
            anonymous_usage: false
        notifications:
            product_updates: false
            new_releases: false

    # Everything Pangolin publishes lives under this one domain: a resource named
    # `wiki` becomes wiki.pg.local.safeqbit.com. Pangolin re-applies this block to
    # its `domains` table on every boot (copyInDomains), so the config file stays
    # the source of truth and UI edits to a config-managed domain do not stick.
    #
    # NOTE: a wildcard covers ONE label. wiki.pg.local.safeqbit.com is covered;
    # wiki.docs.pg.local.safeqbit.com is not. Keep resource names single-label.
    domains:
        domain1:
            base_domain: "pg.local.safeqbit.com"
            cert_resolver: "letsencrypt"
            prefer_wildcard_cert: true

    server:
        cors:
            origins: ["https://pangolin.pg.local.safeqbit.com"]
            methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
            allowed_headers: ["X-CSRF-Token", "Content-Type"]
            credentials: false

    # Pangolin GENERATES Traefik routers for every published resource and serves
    # them at /api/v1/traefik-config, which our edge Traefik polls as its HTTP
    # provider. These names must match the entrypoints/resolver in 10-edge-config.
    #
    # prefer_wildcard_cert makes each generated router ask for the wildcard
    # (tls.domains[0].main = *.pg.local.safeqbit.com) instead of a certificate of
    # its own. Traefik already holds that certificate, so publishing a resource
    # needs no ACME round trip at all — it is live as soon as the router appears.
    # Set in both places: this is the fallback, `domains.domain1` is the per-domain
    # value that actually reaches the router builder.
    traefik:
        http_entrypoint: web
        https_entrypoint: websecure
        cert_resolver: letsencrypt
        prefer_wildcard_cert: true

    flags:
        require_email_verification: false
        disable_signup_without_invite: true
        disable_user_create_org: false
        allow_raw_resources: true
