# Internal service for the Pangolin app. Never exposed directly — the edge
# Traefik fronts it (dashboard/API) and Gerbil talks to :3001 for its config.
#
# The name `pangolin` is not cosmetic: upstream's Traefik dynamic_config.yml
# and Gerbil's --remoteConfig both address the app as the bare host `pangolin`,
# and this deployment keeps those upstream strings verbatim.
apiVersion: v1
kind: Service
metadata:
  name: pangolin
  namespace: pangolin
  labels:
    app.kubernetes.io/name: pangolin
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pangolin
    app.kubernetes.io/component: server
  ports:
    - name: api          # external_port — API + WebSocket (Newt connects here)
      port: 3000
      targetPort: api
      protocol: TCP
    - name: internal     # internal_port — Traefik HTTP provider, Gerbil config
      port: 3001
      targetPort: internal
      protocol: TCP
    - name: next         # next_port — the Next.js dashboard UI
      port: 3002
      targetPort: next
      protocol: TCP
    - name: integration  # integration_port — integration API
      port: 3003
      targetPort: integration
      protocol: TCP
