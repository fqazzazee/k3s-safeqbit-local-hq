# Shared ACME-state PVC — holds the Let's Encrypt account key and the wildcard
# certificate, as Traefik's single acme.json. The edge Traefik writes it at
# /letsencrypt; the Pangolin server mounts the same volume read-only at
# /app/config/letsencrypt, where its acmeCertSync reads it every 5s to report
# certificate status in the UI.
#
# RWX because those are two SEPARATE pods, and nfs-truenas is the cluster's RWX
# class. (Longhorn can do RWX, but only by standing up a share-manager NFS pod;
# no volume in this cluster does that today, and the edge's ability to start is
# not the place to introduce it.)
#
# NAMING, and it matters: the nfs-truenas StorageClass sets
# pathPattern: ${.PVC.namespace}-${.PVC.name}-${.PV.name}, but ${.PV.name} is not
# a token nfs-subdir-external-provisioner understands, so it stays literal and
# the real directory is just <namespace>-<pvc name>. A PVC of a given name
# therefore always re-adopts whatever a previous PVC of that name left behind.
# So a rename is how you get clean ACME state declaratively, with no manual
# "delete acme.json" step — and the old directory stays on the NAS as a rollback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pangolin-letsencrypt
  namespace: pangolin
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-truenas
  resources:
    requests:
      storage: 1Gi
---
# Gerbil's WireGuard private key (--generateAndSaveKeyTo=/var/config/key).
# Persisted so the server's public key survives restarts — otherwise every Newt
# and Olm peer would have to re-handshake against a new key after each rollout.
# RWO/Longhorn: exactly one edge pod mounts it, which is why the edge Deployment
# uses strategy Recreate rather than RollingUpdate.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pangolin-gerbil-key
  namespace: pangolin
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
