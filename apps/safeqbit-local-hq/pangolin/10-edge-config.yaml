# Static + dynamic Traefik config for the Pangolin edge.
#
# Adapted from upstream's reference config (fosrl/pangolin @1.21.1,
# install/config/traefik/) with three deviations, all required here:
#   1. ACME uses DNS-01 (Cloudflare) instead of HTTP-01. This is mandatory
#      twice over: the names resolve only to private IPs so Let's Encrypt
#      cannot reach an HTTP-01 challenge, and wildcard certificates are only
#      issuable over DNS-01 at all.
#   2. The websecure entrypoint pre-requests ONE wildcard certificate covering
#      the whole domain, so no resource ever waits on ACME. See below.
#   3. The Traefik API/dashboard is off (upstream ships insecure: true).
# Everything else — the HTTP provider polling Pangolin, the badger middleware on
# every router, the pp-transport serversTransports — is upstream verbatim.
#
# Badger version tracks Pangolin's installer, which always builds against the
# LATEST badger tag. Bump it when you bump Pangolin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pangolin-edge-config
  namespace: pangolin
data:
  traefik_config.yml: |
    api:
      insecure: false
      dashboard: false

    providers:
      # Pangolin generates a router+service for every published resource and
      # serves them here. This is how a resource created in the UI becomes live
      # routing, with no Traefik CRDs and no Kubernetes RBAC involved.
      http:
        endpoint: "http://pangolin:3001/api/v1/traefik-config"
        pollInterval: "5s"
      file:
        filename: "/etc/traefik/dynamic_config.yml"

    experimental:
      plugins:
        badger:
          moduleName: "github.com/fosrl/badger"
          version: "v1.5.0"

    log:
      level: "INFO"
      format: "common"

    certificatesResolvers:
      letsencrypt:
        acme:
          dnsChallenge:
            provider: cloudflare
            # lego's default propagation check queries the zone's AUTHORITATIVE
            # Cloudflare nameservers on :53 directly, which pods here cannot
            # reach ("NS santino.ns.cloudflare.com:53 did not return the
            # expected TXT"). disableANSChecks skips that and verifies through
            # the recursive resolvers below, which ARE reachable from a pod.
            #
            # delayBeforeChecks: with the authoritative check disabled lego
            # stopped waiting and asked LE within ~13s, so LE saw "No TXT record
            # found" — the record existed at Cloudflare but had not propagated
            # to LE's resolvers yet. This forced delay fixes that race.
            # Do not drop either setting.
            resolvers:
              - "1.1.1.1:53"
              - "1.0.0.1:53"
            propagation:
              disableANSChecks: true
              delayBeforeChecks: "120s"
          email: "fadi@safeqbit.com"
          storage: "/letsencrypt/acme.json"
          caServer: "https://acme-v02.api.letsencrypt.org/directory"

    entryPoints:
      web:
        address: ":80"
      websecure:
        address: ":443"
        transport:
          respondingTimeouts:
            readTimeout: "30m"
        http3:
          advertisedPort: 443
        http:
          tls:
            certResolver: "letsencrypt"
            # THE certificate. Traefik requests this at startup — one DNS-01
            # challenge for one cert that covers the apex and every resource
            # name under it — and renews it on its own at 30 days.
            #
            # The apex needs its own SAN: a wildcard covers *.pg.local... but
            # not pg.local... itself, and the apex is the WireGuard endpoint
            # that Newt preflights over HTTP.
            #
            # Because this certificate is already in the store, Traefik skips
            # the ACME request for any router whose host it already matches —
            # so per-resource routers cost nothing.
            domains:
              - main: "pg.local.safeqbit.com"
                sans:
                  - "*.pg.local.safeqbit.com"
          encodedCharacters:
            allowEncodedSlash: true
            allowEncodedQuestionMark: true

    serversTransport:
      insecureSkipVerify: true

    # Serves 200 on /ping over the web entrypoint. Used by this pod's k8s probes
    # AND by Newt's exit-node preflight, which is a plain HTTP GET to
    # base_endpoint/ping. Gerbil does not answer that — Traefik does, and it can
    # only do so because the two share this pod's address.
    ping:
      entryPoint: "web"

  dynamic_config.yml: |
    http:
      middlewares:
        badger:
          plugin:
            badger:
              disableForwardAuth: true
        redirect-to-https:
          redirectScheme:
            scheme: https

      # The dashboard's own routers. Every OTHER router on this Traefik is
      # generated by Pangolin and arrives over the HTTP provider — these four are
      # static because the dashboard has to be reachable before anything is
      # configured in it. Their `tls.domains` is character-for-character the
      # entrypoint's, so whichever is evaluated first, Traefik only ever asks
      # ACME for one certificate.
      routers:
        # HTTP -> HTTPS redirect
        main-app-router-redirect:
          rule: "Host(`pangolin.pg.local.safeqbit.com`)"
          service: next-service
          entryPoints:
            - web
          middlewares:
            - redirect-to-https
            - badger

        # Next.js (everything except API and WebSocket paths)
        next-router:
          rule: "Host(`pangolin.pg.local.safeqbit.com`) && !PathPrefix(`/api/v1`)"
          service: next-service
          entryPoints:
            - websecure
          middlewares:
            - badger
          tls:
            certResolver: letsencrypt
            domains:
              - main: "pg.local.safeqbit.com"
                sans:
                  - "*.pg.local.safeqbit.com"

        # API (/api/v1 paths)
        api-router:
          rule: "Host(`pangolin.pg.local.safeqbit.com`) && PathPrefix(`/api/v1`)"
          service: api-service
          entryPoints:
            - websecure
          middlewares:
            - badger
          tls:
            certResolver: letsencrypt
            domains:
              - main: "pg.local.safeqbit.com"
                sans:
                  - "*.pg.local.safeqbit.com"

        # WebSocket — the router every Newt connects through, in-cluster ones
        # included (their hostAliases point this name at the edge ClusterIP).
        ws-router:
          rule: "Host(`pangolin.pg.local.safeqbit.com`)"
          service: api-service
          entryPoints:
            - websecure
          middlewares:
            - badger
          tls:
            certResolver: letsencrypt
            domains:
              - main: "pg.local.safeqbit.com"
                sans:
                  - "*.pg.local.safeqbit.com"

      services:
        next-service:
          loadBalancer:
            servers:
              - url: "http://pangolin:3002"  # Next.js server
        api-service:
          loadBalancer:
            servers:
              - url: "http://pangolin:3000"  # API/WebSocket server

    tcp:
      serversTransports:
        pp-transport-v1:
          proxyProtocol:
            version: 1
        pp-transport-v2:
          proxyProtocol:
            version: 2
