# In-cluster Newt site connector — Site "k3s-pg-newt-01".
#
# This connector owns the CLUSTER's resources: its targets are ordinary cluster
# DNS names, e.g. http://vaultwarden.vaultwarden.svc.cluster.local:80. LAN
# targets (RDP and friends) belong to a Newt running ON the LAN instead, so each
# site maps to exactly one network.
#
# Runs in the default netstack mode — userspace WireGuard, so no NET_ADMIN and no
# device access. --native / --native-main would swap in a kernel interface and
# are not worth the privileges here.
#
# Credentials come from 15-sealed-secret-newt.yaml, issued by the UI when the
# Site was created.
#
# WHY THIS ONE NEEDS hostAliases.
#
# A pod that dials its own cluster's MetalLB IP takes a bad path: the packet
# leaves for what looks like an external address, is DNAT'd back to a local
# Service, and the reply returns by a route conntrack cannot reconcile —
# compounded by externalTrafficPolicy: Local, which the edge requires for
# WireGuard to see real source addresses at all.
#
# So this pod never uses 10.10.13.52. hostAliases resolve BOTH the dashboard host
# and the WireGuard endpoint host to the edge's pinned ClusterIP, making every
# packet ordinary pod-to-Service traffic.
#
# This is possible because Newt resolves the WireGuard endpoint CLIENT-SIDE at
# connect time — util.ResolveDomain() -> net.LookupIP() on a CGO_ENABLED=0 Go
# binary, which consults /etc/hosts first. Pangolin hands out a NAME
# (gerbil.base_endpoint in 06-pangolin-config.yaml), not a resolved address, so
# split-horizon resolution is a supported shape rather than a trick.
#
# LAN and Docker-host Newts are unaffected: they resolve the same name through
# Cloudflare to 10.10.13.52 and hit the MetalLB IP normally.
#
# No privileges required: Newt is a USERSPACE WireGuard implementation (netstack),
# so unlike Gerbil it needs no NET_ADMIN and no device access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangolin-newt
  namespace: pangolin
  labels:
    app.kubernetes.io/name: pangolin
    app.kubernetes.io/component: newt
spec:
  replicas: 1
  strategy:
    type: Recreate   # one connector per Site; two would fight over the tunnel
  selector:
    matchLabels:
      app.kubernetes.io/name: pangolin
      app.kubernetes.io/component: newt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangolin
        app.kubernetes.io/component: newt
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # Both names point at 12-edge-service.yaml's pinned ClusterIP. If that IP
      # ever changes, change it here too.
      hostAliases:
        - ip: "10.43.0.100"
          hostnames:
            - pangolin.pg.local.safeqbit.com  # dashboard/API + WebSocket
            - pg.local.safeqbit.com           # WireGuard endpoint
      containers:
        - name: newt
          image: docker.io/fosrl/newt:1.15.0
          env:
            # Resolves via hostAliases to the edge ClusterIP, where Traefik
            # serves the wildcard certificate — which covers this name, so TLS
            # validation still passes on the short path.
            - name: PANGOLIN_ENDPOINT
              value: "https://pangolin.pg.local.safeqbit.com"
            - name: NEWT_ID
              valueFrom:
                secretKeyRef:
                  name: pangolin-newt
                  key: NEWT_ID
            - name: NEWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pangolin-newt
                  key: NEWT_SECRET
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
