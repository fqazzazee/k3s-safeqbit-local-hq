# Credentials for the in-cluster Newt connector, issued by Pangolin when the
# Site was created. Site name in the UI: k3s-pg-newt-01.
#
# These are per-site and single-purpose: they authenticate this one connector to
# Pangolin. Rotating them means deleting the Site and creating a new one, which
# re-issues both values and re-allocates the site's /30 out of the exit node's
# block — so treat a rotation as a reconnect, not a config change.
#
# Re-seal (prints no plaintext):
#   NEWT_ID=... NEWT_SECRET=...   # from the UI, in your shell, not in a file
#   kubectl create secret generic pangolin-newt -n pangolin \
#     --from-literal=NEWT_ID="$NEWT_ID" --from-literal=NEWT_SECRET="$NEWT_SECRET" \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-name=sealed-secrets-controller \
#       --controller-namespace=kube-system --format yaml \
#   > apps/safeqbit-local-hq/pangolin/15-sealed-secret-newt.yaml
#   unset NEWT_ID NEWT_SECRET
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pangolin-newt
  namespace: pangolin
spec:
  encryptedData:
    NEWT_ID: 
    NEWT_SECRET: 
  template:
    metadata:
      name: pangolin-newt
      namespace: pangolin
