# SMTP2GO relay credentials for Pangolin's outbound mail (invites, email
# verification, password resets).
#
# The username and password are the only secret parts, so they are the only
# parts kept here — host, port and no_reply live in plain sight in the `email:`
# block of 06-pangolin-config.yaml.
#
# Injected as EMAIL_SMTP_USER / EMAIL_SMTP_PASS rather than written into the
# ConfigMap. This is upstream behaviour, not a workaround: both keys are declared
# as `.optional().transform(getEnvOrYaml("EMAIL_SMTP_*"))` in
# server/lib/readConfigFile.ts, and getEnvOrYaml returns
# `process.env[envVar] ?? valFromYaml` — the environment wins. Same pattern as
# SERVER_SECRET (04) and POSTGRES_CONNECTION_STRING (08).
#
# Both must be set. server/emails/index.ts builds the nodemailer transport with
# `auth: smtp_user && smtp_pass ? {...} : null`, so one alone silently produces
# an unauthenticated transport that SMTP2GO rejects.
#
# Re-seal (prints no plaintext):
#   EMAIL_SMTP_USER=... EMAIL_SMTP_PASS=...   # in your shell, not in a file
#   kubectl create secret generic pangolin-smtp -n pangolin \
#     --from-literal=EMAIL_SMTP_USER="$EMAIL_SMTP_USER" \
#     --from-literal=EMAIL_SMTP_PASS="$EMAIL_SMTP_PASS" \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-name=sealed-secrets-controller \
#       --controller-namespace=kube-system --format yaml \
#   > apps/safeqbit-local-hq/pangolin/16-sealed-secret-smtp.yaml
#   unset EMAIL_SMTP_USER EMAIL_SMTP_PASS
#
# Rotating is cheap here — the credential is an SMTP2GO user, unrelated to any
# Pangolin state. Create a new one in the SMTP2GO console, re-seal, restart.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pangolin-smtp
  namespace: pangolin
spec:
  encryptedData:
    EMAIL_SMTP_PASS: 
    EMAIL_SMTP_USER: 
  template:
    metadata:
      name: pangolin-smtp
      namespace: pangolin
