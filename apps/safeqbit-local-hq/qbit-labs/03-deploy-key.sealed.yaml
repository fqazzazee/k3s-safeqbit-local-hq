# 03-deploy-key.sealed.yaml
# Read-only SSH deploy key for github.com/fqazzazee/qbit-labs (private), used
# by the fetch-source initContainer. GitHub: repo Settings → Deploy keys →
# "k3s-safeqbit-local-hq (read-only)". Re-key: workbook/qbit-labs.md.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: qbit-labs-deploy-key
  namespace: qbit-labs
spec:
  encryptedData:
    ssh-privatekey: 
  template:
    metadata:
      name: qbit-labs-deploy-key
      namespace: qbit-labs
