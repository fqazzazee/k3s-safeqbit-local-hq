# 01-namespace-pvc.yaml
# Stage 1 of the Vaultwarden migration: create the PVC so the provisioner
# allocates a TrueNAS subdirectory. We'll copy data into that directory
# before deploying the Vaultwarden Pod itself.

---
apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
---
# PersistentVolumeClaim — a Longhorn volume (replicated block storage on the
# nodes' own disks), so Velero's kopia uploader backs it up; nfs-truenas
# volumes are skipped by the backup policy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  # RWO matches Vaultwarden's single-writer reality: Longhorn attaches the
  # volume to one node at a time, which is what we want.
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
