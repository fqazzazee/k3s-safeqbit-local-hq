# chart-updates-report.yaml
# Weekly Slack digest of version drift, in two halves:
#   CHARTS — every HelmRelease's pinned chart version vs the newest stable
#            version upstream publishes.
#   IMAGES — every Git-pinned container image's running tag vs the newest
#            stable tag upstream publishes (added 2026-09-19).
# Both sorted by semver bump (major first), each row with a changelog link.
#
# NAME: the file and its resources are still called chart-updates-* from when
# it only did charts. Renaming them would orphan the old CronJob and
# ConfigMap — every layer below flux-system is prune:false, so a rename
# leaves the OLD objects running and you get two digests every Monday until
# they are deleted by hand. Not worth it for a filename.
#
# Runs Mondays 08:30 America/New_York in the monitoring namespace (so it can
# reuse the alertmanager-slack-webhook SealedSecret; SealedSecrets are
# namespace-scoped) — 30 min after backup-summary-report, which shares the
# slot. Also available on demand as `/cluster updates` from the Slack bot,
# which execs THIS ConfigMap's script (same pattern as summary/backups).
#
# WHY WEEKLY, NOT DAILY: nothing here changes hour to hour, and upgrades land
# in batches weeks apart (the July 2026 wave). A daily copy of the same six
# lines becomes wallpaper, and a noisy channel has already cost this cluster
# once (the orphaned-kopia storm hit Slack's message_limit_exceeded and broke
# both report CronJobs). Type `/cluster updates` when you want it sooner.
#
# ── Where the version data comes from ─────────────────────────────────────
# Each repo's index.yaml, fetched from the UPSTREAM chart repo over HTTPS —
# 10 files, ~7.6 MB, once a week. No credentials; the public chart repos do
# not rate-limit this. A repo that fails is reported as "not checked" and
# costs the other nine nothing.
#
# The job asks source-controller for its CACHED copy first (every
# HelmRepository carries one on .status.artifact.url — Flux downloads these
# anyway to resolve chart versions), but that request is REFUSED and always
# will be: Flux ships its own NetworkPolicies into flux-system, and
# `allow-egress` admits ingress only from pods already inside flux-system
# while `allow-scraping` opens port 8080 alone. The artifact server listens
# on 9090, so anything in `monitoring` gets a TCP reset (k3s's policy
# controller rejects rather than drops).
#
# Reaching the cache would mean adding a NetworkPolicy to flux-system
# allowing monitoring → app=source-controller:9090. Deliberately NOT done
# (2026-09-19): poking a hole in Flux's own firewall is not worth saving ten
# HTTP requests a week against public files. The cache-first attempt is kept
# because it costs one instantly-refused connection per repo and means this
# report starts using the cache with NO code change if that policy is ever
# added. Do not "fix" the refusals — they are expected.
#
# SCOPE — the ~40 sidecar images the charts themselves manage (Longhorn's
# CSI sidecars, cert-manager's three, the prometheus-stack's six) are
# deliberately NOT reported: you cannot move them without bumping the chart,
# which the chart half already tells you. Neither are floating tags
# (affine:stable, redis:7-alpine, postgres:16-alpine, the alpine/python/node
# bases): for those "newer" means the tag moved to a new digest, not a new
# tag, so semver tracking would be a lie. Both groups sit in IGNORE with
# their reason. Digest drift on floating tags is the next piece of work.
#
# HOLDS / IMAGE_HOLDS (in the script) are the pin lists: an entry there is
# reported under "Held" with the reason instead of nagging. Add to them
# whenever an upgrade is deliberately declined, or the report will argue with
# a decision you already made. Today: cert-manager and Home Assistant.
#
# ── The image half ────────────────────────────────────────────────────────
# IMAGES in the script is an explicit map, image repo → where to look and a
# tag pattern; IGNORE is an explicit prefix list of what not to track, with
# the reason. Anything RUNNING that matches neither is reported under
# "Untracked images", so a newly deployed app gets noticed instead of quietly
# going unwatched. That is the whole point of listing rather than guessing.
#
# The running version comes from the workloads, not from Git: a tag bumped in
# a manifest but not yet reconciled should still read as pending. The
# floating half goes further and reads POD status, the only place the digest
# actually pulled is recorded (~1.5 MB of JSON for 167 pods, ~33 MB peak RSS
# — well inside the 128Mi limit below).
#
# Sources are per image, because the tag you must paste into the manifest is
# not always the tag upstream names its release:
#   github  the releases API — it is also the changelog, so it is preferred
#           WHERE the release tag and the image tag are the same string.
#   hub     Docker Hub's tag list, for the ones where they differ:
#           pwpush releases v2.13.0 but ships 2.13.0; photoprism releases
#           260728-bbde8f452 but ships 260728; netbox compounds two versions
#           into v4.7.1-5.1.1; pangolin ships an ee-postgresql- variant.
#           These link to the GitHub releases page instead of a tagged one.
# The per-image `pat` regex matches the running tag AND the candidate tags,
# which (a) filters pre-releases with no keyword blocklist — betas, rcs,
# "latest" and external-snapshotter's client/v8.6.0 simply do not match —
# and (b) guarantees the version this report prints is a REAL tag you can
# paste straight into the manifest.
#
# Flux is tracked as flux2 (what you actually upgrade) rather than as four
# controller images, reading the running version from source-controller's
# app.kubernetes.io/version label.
#
# GitHub anonymous is 60 requests/hour and a run makes ~13, so no token is
# needed; set the optional github-token key in the bot's SealedSecret if
# `/cluster updates` is ever run by hand often enough to matter.
#
# Manual run:
#   kubectl -n monitoring create job --from=cronjob/chart-updates-report updates-now
#
# Local test (prints instead of posting; falls back to upstream indexes):
#   kubectl proxy &
#   API_BASE=http://127.0.0.1:8001 DRY_RUN=1 python3 <script below>
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chart-updates-report
  namespace: monitoring
---
# Read-only: the HelmReleases' pinned versions and the HelmRepositories'
# cached-artifact URLs. No write verbs, no secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chart-updates-report
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["helmrepositories"]
    verbs: ["get", "list"]
  # The image half learns what is RUNNING from the workloads themselves,
  # so a manifest bumped in Git but not yet reconciled is not reported as
  # already done.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  # Floating-tag drift compares the digest a pod actually PULLED against the
  # one its tag resolves to now; only pod status carries that.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chart-updates-report
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chart-updates-report
subjects:
  - kind: ServiceAccount
    name: chart-updates-report
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chart-updates-report-script
  namespace: monitoring
data:
  report.py: |
    #!/usr/bin/env python3
    """Post a one-message Slack digest of Helm chart version drift."""
    import json, os, re, ssl, sys, time
    import urllib.error, urllib.request
    import concurrent.futures as futures
    from datetime import datetime, timezone

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    # In-cluster: use the env-injected API IP, not kubernetes.default.svc.
    # The cluster's ndots:5 + local.safeqbit.com search domain makes short
    # in-cluster names flap under musl resolvers (alpine images).
    API_BASE = os.environ.get("API_BASE") or (
        "https://" + os.environ["KUBERNETES_SERVICE_HOST"] + ":"
        + os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443"))
    NOW = datetime.now(timezone.utc)

    # Charts deliberately pinned behind upstream, with WHY. Without this the
    # digest nags every week about a decision already made and written down —
    # which is exactly how a recurring report stops being read.
    # Keep in sync with the holdout list in workbook/slack-bot.md.
    HOLDS = {
        "cert-manager": "held at 1.16.1 by choice (July 2026 wave): no issues,"
                        " 1.21.x has known crash-loop bugs — target 1.20.x if ever",
    }

    # Pre-release tags never count as "available"; nobody runs an rc in prod here.
    PRERELEASE = ("rc", "alpha", "beta", "dev", "pre", "snapshot", "nightly", "next")

    UA = "cluster-chart-updates-report (k3s-safeqbit-local-hq)"

    ICON = {"major": ":red_circle:", "minor": ":warning:", "patch": ":arrow_up:"}

    # A floating tag that moved a day or two ago is a routine base-image
    # rebuild, not news — python/redis/postgres are rebuilt weekly. Only drift
    # older than this is listed; the rest is collapsed into one line, or the
    # section becomes the wallpaper this report exists to avoid.
    FLOAT_STALE_DAYS = 30

    ACCEPT = ("application/vnd.oci.image.index.v1+json,"
              "application/vnd.docker.distribution.manifest.list.v2+json,"
              "application/vnd.oci.image.manifest.v1+json,"
              "application/vnd.docker.distribution.manifest.v2+json")
    TOKEN_URL = {
        "registry-1.docker.io":
            "https://auth.docker.io/token?service=registry.docker.io"
            "&scope=repository:{repo}:pull",
        "ghcr.io": "https://ghcr.io/token?service=ghcr.io&scope=repository:{repo}:pull",
    }


    def api(path):
        req = urllib.request.Request(API_BASE + path)
        ctx = None
        if API_BASE.startswith("https"):
            req.add_header("Authorization", f"Bearer {open(f'{SA}/token').read()}")
            ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
        # Retry 429/5xx: API priority-and-fairness throttles bursts of list calls.
        for attempt in range(5):
            try:
                with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                    return json.load(r)
            except urllib.error.HTTPError as e:
                if e.code not in (429, 500, 503) or attempt == 4:
                    raise
                time.sleep(2 * (attempt + 1))


    # ---------- versions ----------
    #
    # One model for both halves: a regex whose numeric groups ARE the version,
    # matched against the whole string. It doubles as the pre-release filter —
    # anything the pattern does not match (v1.21.0-beta.0, 6.4.5-beta.1,
    # "latest", "client/v8.6.0") is simply not a candidate, with no keyword
    # blocklist to keep in sync.

    SEMVER = r"^v?(\d+)\.(\d+)\.(\d+)$"


    def vtuple(text, pat=SEMVER):
        m = re.match(pat, str(text).strip())
        return tuple(int(g) for g in m.groups()) if m else None


    def bump_kind(cur, new):
        """major/minor/patch, from the first component that differs."""
        for i in range(min(3, len(cur), len(new))):
            if cur[i] != new[i]:
                return ("major", "minor", "patch")[i]
        return "patch"


    # ---------- Helm index.yaml, parsed without PyYAML ----------
    #
    # The report image is stdlib-only (same rule as the sibling digests), and a
    # chart index is a strictly machine-generated document: `entries:` at column
    # 0, chart names at indent 2, one `- ` list item per version at indent 2 with
    # its own fields at indent 4. Matching `version:`/`created:`/`home:` at
    # EXACTLY indent 4 is what keeps a chart's nested `dependencies:` block (which
    # carries its own `version:` at indent 6) and annotation block scalars out of
    # the results. Parsed line-by-line so a 6 MB index never lands in memory.

    def parse_index(stream, chart):
        """→ [{'version', 'created', 'home'}] for one chart, newest first."""
        out, cur, inside, entries = [], None, False, False
        for raw in stream:
            line = raw.decode() if isinstance(raw, bytes) else raw
            line = line.rstrip()          # tolerate CRLF / trailing space
            if not line.strip():
                continue
            if not line.startswith(" "):                      # column-0 key
                entries = line.startswith("entries:")
                if inside:
                    break
                continue
            if not entries:
                continue
            # A chart key is indent-2 and is not a list item ("  - annotations:").
            if line[:2] == "  " and line[2] not in " -" and line.endswith(":"):
                if inside:                                    # next chart: done
                    break
                inside = line.strip()[:-1] == chart
                continue
            if not inside:
                continue
            if line.startswith("  - "):
                cur = {"version": None, "created": "", "home": ""}
                out.append(cur)
                line = "    " + line[4:]                      # 1st field of the item
            if cur is None:
                continue
            # Only this item's OWN fields (indent 4) — never nested dependencies.
            if line.startswith("    ") and line[4] != " ":
                k, _, v = line[4:].partition(":")
                if k in ("version", "created", "home"):
                    cur[k] = v.strip().strip('"\'')
        return [e for e in out if e["version"]]


    def fetch_index(repo, chart):
        """Try source-controller's cached artifact, then the upstream index.
        The cache is expected to refuse (Flux's NetworkPolicies block 9090
        from outside flux-system) — upstream is the normal path. See the
        header comment before changing this order."""
        art = (repo.get("status") or {}).get("artifact", {}).get("url")
        urls = [(art, "cache")] if art else []
        urls.append((repo["spec"]["url"].rstrip("/") + "/index.yaml", "upstream"))
        last = None
        for url, kind in urls:
            if not url or url.startswith("oci://"):
                continue
            # Cloudflare-fronted chart repos (jetstack, goauthentik) 403 the
            # default Python-urllib User-Agent — send a real one.
            req = urllib.request.Request(url, headers={"User-Agent": UA})
            try:
                with urllib.request.urlopen(req, timeout=60) as r:
                    return parse_index(r, chart), kind
            except Exception as e:                            # noqa: BLE001
                last = e
        raise RuntimeError(f"{type(last).__name__}: {last}")



    # ---------- Git-pinned images ----------

    def canon(repo):
        """Normalise a repo to one spelling. The API reports the registry's own
        form (docker.io/library/busybox) while manifests use the short one
        (busybox), and both must land on the same key."""
        if repo.startswith("docker.io/"):
            repo = repo[len("docker.io/"):]
        if repo.startswith("library/"):
            repo = repo[len("library/"):]
        return repo



    # ── What we track ─────────────────────────────────────────────────────────
    # Keyed by image repo exactly as written in the manifests (no tag). Every
    # entry is deliberate: an image NOT listed here and not matched by IGNORE
    # below is reported as "untracked", so a newly deployed app gets noticed
    # instead of silently going unwatched.
    #
    #   src   "github"   releases API — also the changelog, so prefer it
    #         "hub"      Docker Hub tag listing (when the image tag is not a
    #                    GitHub release tag)
    #   pat   regex matched against the WHOLE tag; its numeric groups form the
    #         version tuple. This doubles as the pre-release filter: a tag the
    #         pattern does not match is not a candidate, so betas, rcs,
    #         "latest", "client/v8.6.0" and friends drop out for free.
    #         INVARIANT: the same pattern matches the RUNNING tag and the
    #         candidate tags, so the version this report prints is always a real
    #         tag you can paste into the manifest. That is why an image whose
    #         GitHub release tag differs in shape from its image tag (pwpush
    #         v2.13.0 vs 2.13.0, photoprism 260728-bbde8f45 vs 260728) is read
    #         from the REGISTRY and merely links to GitHub for the changelog.
    #   name  display name, when the repo name is not the obvious one
    #   label (ns, deployment) — take the RUNNING version from that Deployment's
    #         app.kubernetes.io/version label instead of the image tag.

    IMAGES = {
        "ghcr.io/home-assistant/home-assistant":
            dict(src="github", repo="home-assistant/core", pat=r"^(\d+)\.(\d+)\.(\d+)$"),
        "ghcr.io/immich-app/immich-server":
            dict(src="github", repo="immich-app/immich", pat=SEMVER),
        "ghcr.io/immich-app/immich-machine-learning":
            dict(src="github", repo="immich-app/immich", pat=SEMVER),
        "louislam/uptime-kuma":
            dict(src="github", repo="louislam/uptime-kuma", pat=SEMVER),
        "vaultwarden/server":
            dict(src="github", repo="dani-garcia/vaultwarden", pat=SEMVER,
                 name="vaultwarden"),
        "rcourtman/pulse":
            dict(src="github", repo="rcourtman/Pulse", pat=SEMVER),
        "pglombardo/pwpush":
            dict(src="hub", repo="pglombardo/pwpush", pat=r"^(\d+)\.(\d+)\.(\d+)$",
                 link="https://github.com/pglombardo/PasswordPusher/releases"),
        "cloudflare/cloudflared":
            dict(src="github", repo="cloudflare/cloudflared", pat=r"^(\d+)\.(\d+)\.(\d+)$"),
        "docker.io/fosrl/gerbil":
            dict(src="github", repo="fosrl/gerbil", pat=SEMVER),
        "docker.io/fosrl/newt":
            dict(src="github", repo="fosrl/newt", pat=SEMVER),
        "docker.io/traefik":
            dict(src="github", repo="traefik/traefik", pat=SEMVER),
        # Release tags carry a build suffix the image tag drops (260728-bbde8f45),
        # and the registry also holds -ce/-legacy/-postgres variants we do not
        # run; the bare-date pattern picks the plain image out of both.
        "photoprism/photoprism":
            dict(src="hub", repo="photoprism/photoprism", pat=r"^(\d{6})$",
                 link="https://github.com/photoprism/photoprism/releases"),
        # Upstream releases are the netbox-docker version (5.1.1) while the image
        # tag compounds it with NetBox's own: v4.7.1-5.1.1. Only the registry
        # knows which pairs exist, so the tag list is the source of truth.
        "netboxcommunity/netbox":
            dict(src="hub", repo="netboxcommunity/netbox",
                 pat=r"^v(\d+)\.(\d+)\.(\d+)-(\d+)\.(\d+)\.(\d+)$",
                 link="https://github.com/netbox-community/netbox-docker/releases"),
        # Same: the ee-postgresql- variant is a registry-only tag.
        "docker.io/fosrl/pangolin":
            dict(src="hub", repo="fosrl/pangolin",
                 pat=r"^ee-postgresql-(\d+)\.(\d+)\.(\d+)$",
                 link="https://github.com/fosrl/pangolin/releases"),
        # The four controllers are versioned together as Flux itself, and that is
        # what you upgrade (flux bootstrap), so track flux2 and read the running
        # version off the controller's own version label.
        "ghcr.io/fluxcd/source-controller":
            dict(src="github", repo="fluxcd/flux2", pat=SEMVER, name="flux2",
                 label=("flux-system", "source-controller")),
        "registry.k8s.io/cpa/cluster-proportional-autoscaler":
            dict(src="github", repo="kubernetes-sigs/cluster-proportional-autoscaler",
                 pat=SEMVER),
        "registry.k8s.io/sig-storage/snapshot-controller":
            dict(src="github", repo="kubernetes-csi/external-snapshotter", pat=SEMVER),
    }

    # Prefix → why it is not tracked. Order matters: first match wins.
    IGNORE = [
        ("docker.io/longhornio/", "Longhorn chart"),
        ("quay.io/jetstack/", "cert-manager chart"),
        ("quay.io/metallb/", "metallb chart"),
        ("quay.io/frrouting/", "metallb chart"),
        ("quay.io/prometheus", "kube-prometheus-stack chart"),
        ("quay.io/kiwigrid/", "kube-prometheus-stack chart"),
        ("docker.io/grafana/", "kube-prometheus-stack chart"),
        ("registry.k8s.io/kube-state-metrics/", "kube-prometheus-stack chart"),
        ("registry.k8s.io/ingress-nginx/", "ingress-nginx chart"),
        ("registry.k8s.io/sig-storage/nfs-subdir", "nfs-provisioner chart"),
        ("docker.io/bitnami/sealed-secrets", "sealed-secrets chart"),
        ("ghcr.io/goauthentik/", "authentik chart"),
        ("ghcr.io/cloudnative-pg/", "cloudnative-pg chart"),
        ("velero/velero", "velero chart"),
        ("ghcr.io/fluxcd/", "versioned together as Flux (see flux2)"),
        ("rancher/mirrored-", "shipped by k3s itself"),
        # Floating or base tags: "newer" means the tag moved to a new digest, not
        # a new tag, so semver tracking would be a lie. Phase 3 (digest drift).
        ("ghcr.io/toeverything/affine", "floating tag :stable"),
        ("docker.io/valkey/valkey", "floating base image"),
        ("ghcr.io/immich-app/postgres", "pinned DB image; a bump is a data migration"),
        ("postgres", "floating base image"),
        ("redis", "floating base image"),
        ("python", "floating base image"),
        ("node", "floating base image"),
        ("alpine", "floating base image"),
        ("busybox", "floating base image"),
    ]

    # Images deliberately pinned behind upstream, with why. Same contract as the
    # chart HOLDS: without this the digest re-argues a settled decision weekly.
    IMAGE_HOLDS = {
        "ghcr.io/home-assistant/home-assistant":
            "Sensi HACS integration gate — never downgrade, see the"
            " home-assistant workbook",
    }



    # Both sides of every comparison go through canon() so the map stays
    # readable (written as the manifests spell it) while matching is exact.
    TRACKED = {}
    IGNORE_C = []
    HOLDS_C = {}


    def _canonicalise():
        TRACKED.update({canon(k): v for k, v in IMAGES.items()})
        IGNORE_C.extend((canon(p), r) for p, r in IGNORE)
        HOLDS_C.update({canon(k): v for k, v in IMAGE_HOLDS.items()})



    def get_json(url, headers=None):
        h = {"User-Agent": UA}
        h.update(headers or {})
        tok = os.environ.get("GITHUB_TOKEN")
        if tok and "api.github.com" in url:
            h["Authorization"] = f"Bearer {tok}"
        with urllib.request.urlopen(
                urllib.request.Request(url, headers=h), timeout=30) as r:
            return json.load(r)


    def canon(repo):
        """Normalise a repo to one spelling. The API reports the registry's own
        form (docker.io/library/busybox) while manifests use the short one
        (busybox), and both must land on the same key."""
        if repo.startswith("docker.io/"):
            repo = repo[len("docker.io/"):]
        if repo.startswith("library/"):
            repo = repo[len("library/"):]
        return repo



    # ---------- where images are running ----------

    WORKLOADS = [("/apis/apps/v1/deployments", "spec.template"),
                 ("/apis/apps/v1/statefulsets", "spec.template"),
                 ("/apis/apps/v1/daemonsets", "spec.template"),
                 ("/apis/batch/v1/cronjobs", "spec.jobTemplate.spec.template")]


    def running_images():
        """image repo → {'tags': {tag: [where…]}}"""
        found = {}
        for path, tpl_path in WORKLOADS:
            for i in api(path)["items"]:
                tpl = i
                for k in tpl_path.split("."):
                    tpl = (tpl or {}).get(k) or {}
                ps = tpl.get("spec") or {}
                where = f"{i['metadata']['namespace']}/{i['metadata']['name']}"
                for c in (ps.get("containers") or []) + (ps.get("initContainers") or []):
                    img = c.get("image", "")
                    img = img.split("@", 1)[0]                 # drop any digest pin
                    # The last colon separates the tag only when no "/" follows it
                    # — otherwise it is a registry port (host:5000/repo).
                    if ":" in img and "/" not in img.rsplit(":", 1)[1]:
                        repo, tag = img.rsplit(":", 1)
                    else:
                        repo, tag = img, "latest"
                    found.setdefault(canon(repo), {}).setdefault(tag, []).append(where)
        return found


    def version_label(ns, name):
        d = api(f"/apis/apps/v1/namespaces/{ns}/deployments/{name}")
        return (d["metadata"].get("labels") or {}).get("app.kubernetes.io/version")



    # ---------- upstream sources ----------

    def github_tags(repo, pat):
        """→ [(vtuple, tag, url, published)] for non-prerelease releases."""
        rel = get_json(f"https://api.github.com/repos/{repo}/releases?per_page=100")
        out = []
        for r in rel:
            if r.get("prerelease") or r.get("draft"):
                continue
            v = vtuple(r["tag_name"], pat)
            if v:
                out.append((v, r["tag_name"], r["html_url"], r.get("published_at", "")))
        return out


    def hub_tags(repo, pat):
        d = get_json(f"https://hub.docker.com/v2/repositories/{repo}/tags"
                     f"?page_size=100&ordering=last_updated")
        out = []
        for t in d.get("results", []):
            v = vtuple(t["name"], pat)
            if v:
                out.append((v, t["name"], "", t.get("last_updated", "")))
        return out


    def lookup(image, spec):
        fn = github_tags if spec["src"] == "github" else hub_tags
        return fn(spec["repo"], spec["pat"])



    def collect_images():
        running = running_images()
        rows, broken, untracked = [], [], []

        for repo, tags in sorted(running.items()):
            if repo in TRACKED:
                continue
            why = next((r for p, r in IGNORE_C if repo.startswith(p)), None)
            if not why:
                untracked.append((repo, sorted(tags)[0]))

        todo = [(repo, spec) for repo, spec in TRACKED.items() if repo in running]
        with futures.ThreadPoolExecutor(8) as ex:
            results = dict(zip([r for r, _ in todo],
                               ex.map(lambda rs: _safe(rs[0], rs[1]), todo)))

        for repo, spec in todo:
            tags = running[repo]
            err, cands = results[repo]
            name = spec.get("name") or repo.rsplit("/", 1)[-1]
            if err:
                broken.append(f"{name}: {err}")
                continue
            if spec.get("label"):
                cur_tag = version_label(*spec["label"]) or "?"
            else:
                # If one image runs at several tags, report the laggard — that is
                # the one still needing the bump.
                cur_tag = min(tags, key=lambda t: vtuple(t, spec["pat"]) or ())
            cur = vtuple(cur_tag, spec["pat"])
            if not cands:
                broken.append(f"{name}: no upstream tag matched {spec['pat']}")
                continue
            top = max(cands)
            if cur is None:
                broken.append(f"{name}: running tag {cur_tag} does not match its pattern")
                continue
            where = sorted({w for ws in tags.values() for w in ws})
            rows.append(dict(
                name=name, repo=repo, cur=cur_tag, new=top[1],
                link=top[2] or spec.get("link", ""), released=age(top[3]),
                behind=sum(1 for c in cands if c[0] > cur),
                kind=bump_kind(cur, top[0]), stale=top[0] > cur, where=where))
        return rows, broken, untracked


    def _safe(repo, spec):
        try:
            return None, lookup(repo, spec)
        except Exception as e:                                 # noqa: BLE001
            return f"{type(e).__name__}: {str(e)[:90]}", None


    # ---------- floating tags: digest drift ----------
    #
    # For a tag that carries no version (affine:stable, redis:7-alpine, the
    # alpine/python/node bases) "newer" means the tag was rebuilt and now points
    # at a different digest — semver has nothing to say. What CAN be said is
    # whether the digest these pods are running is still the one the tag
    # resolves to. If not, a restart would silently change what runs.
    #
    # The digest has to come from POD status: a workload spec only carries the
    # tag, which is precisely the problem. Both sides are the multi-arch INDEX
    # digest, so the comparison is apples-to-apples — verified against
    # alpine:3.20, which matched its registry digest exactly.
    #
    # The set of images checked is derived from IGNORE, so there is one list to
    # keep: an entry whose reason starts with "floating" is checked here.


    def running_digests():
        """(repo, tag) → {'digests': {…}, 'ns': {…}} for every floating image."""
        prefixes = [p for p, r in IGNORE_C if r.startswith("floating")]
        out = {}
        for p in api("/api/v1/pods")["items"]:
            ns = p["metadata"]["namespace"]
            st = p["status"]
            for cs in ((st.get("containerStatuses") or [])
                       + (st.get("initContainerStatuses") or [])):
                img, iid = cs.get("image", ""), cs.get("imageID", "")
                if "@sha256:" in img:                     # already digest-pinned
                    continue
                if ":" in img and "/" not in img.rsplit(":", 1)[1]:
                    repo, tag = img.rsplit(":", 1)
                else:
                    continue                              # no tag ⇒ nothing to float
                repo = canon(repo)
                if not any(repo.startswith(x) for x in prefixes):
                    continue
                if "@sha256:" in iid:
                    dig = "sha256:" + iid.split("@sha256:", 1)[1]
                elif iid.startswith("sha256:"):
                    dig = iid
                else:
                    continue                              # not pulled yet
                e = out.setdefault((repo, tag), {"digests": set(), "ns": set()})
                e["digests"].add(dig)
                e["ns"].add(ns)
        return out


    def hub_digest(repo, tag):
        """Docker Hub also reports when the tag last moved, which is the age we
        want — so prefer it over a bare OCI HEAD for docker.io images."""
        hub = repo if "/" in repo else "library/" + repo
        d = get_json(f"https://hub.docker.com/v2/repositories/{hub}/tags/{tag}")
        return d.get("digest"), d.get("last_updated") or ""


    def oci_digest(repo, tag):
        """Any OCI registry. No move timestamp is available this way."""
        if "." in repo.split("/")[0]:                     # already has a host
            host, path = repo.split("/", 1)
        else:
            host, path = "registry-1.docker.io", (
                repo if "/" in repo else "library/" + repo)
        h = {"User-Agent": UA, "Accept": ACCEPT}
        url = TOKEN_URL.get(host)
        if url:
            t = get_json(url.format(repo=path))
            h["Authorization"] = f"Bearer {t.get('token') or t.get('access_token')}"
        req = urllib.request.Request(f"https://{host}/v2/{path}/manifests/{tag}",
                                     headers=h, method="HEAD")
        with urllib.request.urlopen(req, timeout=30) as r:
            return r.headers.get("Docker-Content-Digest"), ""


    def upstream_digest(repo, tag):
        if "." not in repo.split("/")[0]:                 # bare name ⇒ Docker Hub
            try:
                return hub_digest(repo, tag)
            except Exception:                             # noqa: BLE001
                pass                                      # fall through to OCI
        return oci_digest(repo, tag)


    def collect_floating():
        def one(kv):
            (repo, tag), info = kv
            try:
                up, moved = upstream_digest(repo, tag)
            except Exception as e:                        # noqa: BLE001
                return dict(repo=repo, tag=tag, up="", moved=None,
                            drift=False, err=f"{type(e).__name__}", **info)
            return dict(repo=repo, tag=tag, up=up, moved=days(moved), err="",
                        drift=bool(up) and up not in info["digests"], **info)

        items = sorted(running_digests().items())
        with futures.ThreadPoolExecutor(8) as ex:
            return list(ex.map(one, items))


    # ---------- report ----------

    def newest(versions):
        stable = [e for e in versions if vtuple(e["version"])]
        return max(stable, key=lambda e: vtuple(e["version"])) if stable else None


    def days(ts):
        try:
            return (NOW - datetime.fromisoformat(ts.replace("Z", "+00:00"))).days
        except Exception:                                     # noqa: BLE001
            return None


    def age(ts):
        d = days(ts)
        if d is None:
            return ""
        return f"{d}d ago" if d < 90 else f"{d // 30}mo ago"


    def collect_charts():
        repos = {}
        for r in api("/apis/source.toolkit.fluxcd.io/v1/helmrepositories")["items"]:
            repos[(r["metadata"]["namespace"], r["metadata"]["name"])] = r

        rows, broken = [], []
        for hr in api("/apis/helm.toolkit.fluxcd.io/v2/helmreleases")["items"]:
            meta, spec = hr["metadata"], hr["spec"]
            cs = (spec.get("chart") or {}).get("spec") or {}
            chart, pinned = cs.get("chart"), cs.get("version")
            if not chart or not pinned:
                # chartRef (OCI) releases carry no inline version to compare.
                broken.append(f"{meta['namespace']}/{meta['name']}: no chart version")
                continue
            ref = cs.get("sourceRef") or {}
            repo = repos.get((ref.get("namespace", meta["namespace"]), ref.get("name")))
            if not repo:
                broken.append(f"{meta['namespace']}/{meta['name']}: "
                              f"HelmRepository {ref.get('name')} not found")
                continue
            try:
                versions, src = fetch_index(repo, chart)
                top = newest(versions)
            except Exception as e:                            # noqa: BLE001
                broken.append(f"{meta['namespace']}/{meta['name']} ({chart}): "
                              f"{str(e)[:120]}")
                continue
            if not top:
                broken.append(f"{meta['namespace']}/{meta['name']}: no stable versions")
                continue
            cur = vtuple(pinned)
            ahead = [e for e in versions
                     if cur and (vtuple(e["version"]) or ()) > cur]
            rows.append({
                "ns": meta["namespace"], "name": meta["name"], "chart": chart,
                "cur": pinned, "new": top["version"], "home": top["home"],
                "released": age(top["created"]), "behind": len(ahead),
                "kind": bump_kind(cur or (), vtuple(top["version"]) or ()),
                "src": src,
                "stale": bool(cur) and (vtuple(top["version"]) or ()) > cur,
            })
        return rows, broken


    ORDER = {"major": 0, "minor": 1, "patch": 2}


    def _row_sort(r):
        return (ORDER[r["kind"]], -r["behind"])


    def render(charts, cbroken, images, ibroken, untracked, floating):
        c_behind = sorted((r for r in charts
                           if r["stale"] and r["chart"] not in HOLDS), key=_row_sort)
        c_held = [r for r in charts if r["stale"] and r["chart"] in HOLDS]
        c_ok = sorted({r["chart"] for r in charts if not r["stale"]})

        i_behind = sorted((r for r in images
                           if r["stale"] and r["repo"] not in HOLDS_C), key=_row_sort)
        i_held = [r for r in images if r["stale"] and r["repo"] in HOLDS_C]
        i_ok = sorted(r["name"] for r in images if not r["stale"])

        out = [f":package: *Updates* — {len(charts) + len(cbroken)} charts ·"
               f" {len(images) + len(ibroken)} images · {NOW.strftime('%Y-%m-%d')}"]

        if c_behind:
            out.append("")
            out.append(f"*Charts behind* ({len(c_behind)})")
            for r in c_behind:
                link = f" · <{r['home']}|changelog>" if r["home"].startswith("http") else ""
                plus = f" · {r['behind']} releases" if r["behind"] > 1 else ""
                out.append(f"{ICON[r['kind']]} `{r['chart']}` {r['cur']} → *{r['new']}*"
                           f"  _{r['kind']}_{plus} · released {r['released']}"
                           f"{link}\n      {r['ns']}/{r['name']}")

        if i_behind:
            out.append("")
            out.append(f"*Images behind* ({len(i_behind)})")
            for r in i_behind:
                link = f" · <{r['link']}|changelog>" if r["link"].startswith("http") else ""
                plus = f" · {r['behind']} releases" if r["behind"] > 1 else ""
                # Namespaces only when the image spans more than one — otherwise
                # the app name already says where it lives.
                ns = sorted({w.split("/")[0] for w in r["where"]})
                place = f" · {', '.join(ns)}" if len(ns) > 1 else ""
                out.append(f"{ICON[r['kind']]} `{r['name']}` {r['cur']} → *{r['new']}*"
                           f"  _{r['kind']}_{plus} · released {r['released']}"
                           f"{place}{link}")

        if not c_behind and not i_behind:
            out.append("\n:white_check_mark: every chart and tracked image is on"
                       " the newest stable release")

        if c_held or i_held:
            out.append("")
            out.append(f"*Held* ({len(c_held) + len(i_held)})")
            for r in c_held:
                out.append(f":double_vertical_bar: `{r['chart']}` {r['cur']} →"
                           f" {r['new']} — {HOLDS[r['chart']]}")
            for r in i_held:
                out.append(f":double_vertical_bar: `{r['name']}` {r['cur']} →"
                           f" {r['new']} — {HOLDS_C[r['repo']]}")

        if c_ok or i_ok:
            out.append("")
            if c_ok:
                out.append(f"*Current charts* ({len(c_ok)}): " + ", ".join(c_ok))
            if i_ok:
                out.append(f"*Current images* ({len(i_ok)}): " + ", ".join(i_ok))

        if floating:
            moved = [r for r in floating if r["drift"]]
            # Unknown move date ⇒ always listed: the only such image is an app
            # (affine:stable), where a move IS a new release worth acting on.
            stale = [r for r in moved
                     if r["moved"] is None or r["moved"] >= FLOAT_STALE_DAYS]
            fresh = [r for r in moved if r not in stale]
            out.append("")
            out.append(f"*Floating tags* ({len(floating)} tracked ·"
                       f" {len(moved)} moved) — a restart would change what these run")
            for r in sorted(stale, key=lambda r: -(r["moved"] or 10**6)):
                when = (f"tag moved {r['moved']}d ago" if r["moved"] is not None
                        else "tag moved, date unknown")
                out.append(f":arrows_counterclockwise: `{r['repo']}:{r['tag']}` —"
                           f" {when} · running `{sorted(r['digests'])[0][7:19]}`,"
                           f" upstream `{r['up'][7:19]}` · {', '.join(sorted(r['ns']))}")
            if fresh:
                out.append(f"_{len(fresh)} more moved within {FLOAT_STALE_DAYS}d"
                           " (routine base-image rebuilds): "
                           + ", ".join(sorted(f"{r['repo']}:{r['tag']}" for r in fresh))
                           + "_")
            if not moved:
                out.append(":white_check_mark: every floating tag still resolves to"
                           " the digest these pods are running")

        fbroken = [f"{r['repo']}:{r['tag']}: {r['err']}" for r in floating if r["err"]]
        if cbroken or ibroken or fbroken:
            out.append("")
            out.append("*Not checked*")
            out.extend(f":grey_question: {b}" for b in cbroken + ibroken + fbroken)

        # The point of the map being explicit: anything newly deployed and not
        # yet classified shows up here instead of going quietly unwatched.
        if untracked:
            out.append("")
            out.append(f"*Untracked images* ({len(untracked)}) — add to IMAGES or"
                       " IGNORE in `chart-updates-report.yaml`")
            out.extend(f":grey_question: `{repo}:{tag}`" for repo, tag in untracked)

        if any(r["src"] == "cache" for r in charts):
            # Only worth a line if it happens — upstream is the normal path.
            out.append("\n_:information_source: some indexes came from"
                       " source-controller's cache_")
        out.append("\n_charts: bump `version:` in `infrastructure/.../controllers/"
                   "<chart>.yaml` · images: bump the tag in `apps/.../<app>/`"
                   " · floating: delete the pod to re-pull (never `rollout"
                   " restart` — Flux SSA double-rolls) · `/cluster flux` for"
                   " reconcile state_")
        return "\n".join(out)


    def post(msg):
        if os.environ.get("DRY_RUN"):
            print(msg)
            return
        req = urllib.request.Request(
            os.environ["SLACK_WEBHOOK_URL"],
            data=json.dumps({"text": msg}).encode(),
            headers={"Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=30) as r:
            if r.read().decode() != "ok":
                sys.exit(1)
        print("report posted")


    _canonicalise()
    post(render(*collect_charts(), *collect_images(), collect_floating()))
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chart-updates-report
  namespace: monitoring
spec:
  schedule: "30 8 * * 1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Hard stop so a hung job can never wedge the schedule (see the
      # netbox-housekeeping incident: stuck Active job + Forbid = silently
      # never runs again).
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: chart-updates-report
          restartPolicy: Never
          # ndots:1 so hooks.slack.com and source-controller's trailing-dot
          # FQDN resolve as absolute names. The cluster default (ndots:5 +
          # local.safeqbit.com search domain) breaks multi-dot names under
          # musl resolvers (python:alpine). The k8s API needs no DNS at all.
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          containers:
            - name: report
              # Stdlib-only script; pinned digest-stable minor tag.
              image: python:3.13-alpine
              command: ["python3", "/scripts/report.py"]
              env:
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: alertmanager-slack-webhook
                      key: webhook-url
                # Optional. Anonymous GitHub is 60 requests/hour and this
                # job makes ~13, so a token is only needed if `/cluster
                # updates` gets hammered by hand. Add the key to the
                # SealedSecret to switch it on; absent = anonymous.
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cluster-slack-bot-tokens
                      key: github-token
                      optional: true
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  # The 6 MB prometheus-community index is streamed line by
                  # line, never held whole — this stays flat.
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: chart-updates-report-script
