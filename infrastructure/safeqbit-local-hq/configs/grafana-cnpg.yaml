# grafana-cnpg.yaml
# CNPG Cluster for Grafana's internal database.
#
# Grafana 13 ships with an embedded "unified storage" system that runs
# background jobs against its database every 30s (dashboard cleanup, secret
# lease management, resource sync). Combined with NFS-backed SQLite this
# causes guaranteed SQLITE_BUSY deadlocks under any sustained load.
# PostgreSQL handles concurrent connections without file-level locking.
#
# All dashboards and datasources are provisioned from ConfigMaps via the
# grafana-sc sidecars, so no data migration from SQLite is needed — Grafana
# initialises the schema on first boot.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-cnpg
  namespace: monitoring
spec:
  # instances: 2 — primary + 1 standby. Grafana goes down without its DB; a
  # second instance reduces recovery time from "minutes to pg_basebackup" to
  # "seconds to failover". Cost: a second 5Gi PVC.
  instances: 2

  postgresql:
    parameters:
      # WAL ring sizing (added 2026-08-17). CNPG's defaults —
      # wal_keep_size=512MB, max_wal_size=1GB — pinned pg_wal at ~561MB on every
      # cluster in this fleet while the actual `base/` dir was only 33-245MB.
      # Velero snapshots these PVCs whole, so ~90% of every CNPG backup shipped
      # to B2 was empty WAL ring. Measured after the 2026-08-17 rollout: pg_wal
      # settles at 209MB (128MB keep + headroom + in-flight = 13 x 16MB segs),
      # taking total pgdata from 3.85GB to 1.74GB across the six clusters.
      #
      # Safe here because replicationSlots.highAvailability is on by default:
      # standbys hold their own slot, so wal_keep_size is only belt-and-braces
      # for slotless catch-up. These are sighup parameters — CNPG applies them
      # with a config reload, no Postgres restart and no failover.
      #
      # Lower max_wal_size means more frequent checkpoints; negligible on these
      # low-write DBs. Revisit if a cluster ever becomes write-heavy.
      max_wal_size: "256MB"
      min_wal_size: "80MB"
      wal_keep_size: "128MB"

  bootstrap:
    initdb:
      database: grafana
      owner: grafana

  storage:
    storageClass: longhorn
    size: 5Gi

  backup:
    volumeSnapshot:
      className: longhorn-velero
      snapshotOwnerReference: backup

  affinity:
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true
