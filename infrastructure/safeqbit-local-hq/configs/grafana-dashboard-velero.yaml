                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 12,
          "type": "table",
          "title": "Kopia repository maintenance",
          "description": "One row per BackupRepository. Maintenance is what actually frees deleted blobs on B2 \u2014 until it runs, a deleted backup still bills. Global cadence is 168h (defaultRepoMaintainFrequency in controllers/velero.yaml); the pulse repo alone gets a daily sweep via configs/velero-repo-maintenance-pulse.yaml because it dedups badly. A repo with no runs in the range is what to chase when the bucket will not shrink. There is no failure counter \u2014 Velero 1.18 exposes only successes and durations \u2014 so a failing sweep shows up as an absent run, not as an error. Rows for renamed apps (e.g. sra-dev-demo) are stale repos that outlived their schedule.",
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 31
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (repository_name) (increase(velero_repo_maintenance_success_total[$__range]))",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "expr": "sum by (repository_name) (increase(velero_repo_maintenance_duration_seconds_sum[$__range])) / sum by (repository_name) (increase(velero_repo_maintenance_duration_seconds_count[$__range]))",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "repository_name",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true
                },
                "renameByName": {
                  "repository_name": "Repository",
                  "Value #A": "Maintenance runs",
                  "Value #C": "Avg duration"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Maintenance runs",
                    "desc": false
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true,
                "minWidth": 160
              },
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Maintenance runs"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "orange",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Avg duration"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Repository maintenance sweeps per day",
          "description": "increase(velero_repo_maintenance_success_total[1d]) per repository. This is the visual answer to \u201cdid maintenance actually run?\u201d \u2014 the pulse repo should show a bar most days, every other repo roughly weekly. A flat line on a repo whose backups you have been deleting means the freed space is still being billed on B2.",
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 31
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (repository_name) (increase(velero_repo_maintenance_success_total[1d]))",
              "legendFormat": "{{repository_name}}"
