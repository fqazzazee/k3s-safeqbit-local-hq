# velero-schedule-affine.yaml
# Bi-weekly Velero backup of the affine namespace to B2.
#
# Covers: affine-storage PVC (blobs, avatars), affine-config PVC
# (private.key), the affine-cnpg PVC, SealedSecret, PVC definitions,
# Ingress, Deployments.
#
# Postgres data IS in this backup, contrary to what this comment claimed until
# 2026-08-17. Velero snapshots affine-cnpg-1 on every run (~645MB/run in the
# DataUploads) because the PVC is claimed by the CNPG Cluster CR, not only by
# the pod. That is deliberate and load-bearing: the CNPG ScheduledBackup layer
# writes Longhorn VolumeSnapshots, which are in-cluster only, so this Velero
# copy is the ONLY off-site copy of the affine database. Do not exclude it
# without first giving CNPG a real off-site target (Barman/S3, improvement-plan
# P3.1).
#
# Schedule: 2nd + 17th 03:00 UTC. Moved off Sundays 2026-08-17; `*/14` (the
# literal bi-weekly form) resolves to 1/15/29, which home-assistant already
# owns, and doubling up breaks the one-namespace-per-day B2 stagger.
# Retention: 21 days -> keep the last 2 restore points. Velero retention is
# TTL-based (there is no native "keep N"), so the TTL sits between one interval
# (~15d, so the previous backup survives) and two (~30d, so the one before that
# expires). Tuned down from 60d/weekly on 2026-08-17: that combination held
# ~8.6 copies and was 10.7GB of the 31GB B2 footprint on its own.

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: affine-biweekly
  namespace: velero
spec:
  schedule: "0 3 2,17 * *"

  template:
    ttl: "504h0m0s"
    includedNamespaces:
      - affine
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME workflow objects. Restoring these plants a stale
      # CertificateRequest that squats on the name cert-manager needs for the
      # next renewal, silently stalling it (vaultwarden-tls, 2026-07-18).
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skip NFS volumes (TrueNAS owns their protection) so backups complete
    # instead of PartiallyFailing. See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
