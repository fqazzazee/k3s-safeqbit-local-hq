# velero-schedule-affine.yaml
# Bi-weekly backup of the affine namespace to B2.
#
# Covers: affine-storage (blobs, avatars), affine-config (private.key),
# affine-cnpg (Postgres), and the namespace's k8s objects.
# Keep affine-cnpg in scope — CNPG's own snapshots stay in-cluster, so this is
# the only off-site copy of the database.
#
# Schedule: 2nd + 17th, 03:00 UTC
# Retention: 21d TTL = last 2 restore points

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: affine-biweekly
  namespace: velero
spec:
  schedule: "0 3 2,17 * *"

  template:
    ttl: "504h0m0s"
    includedNamespaces:
      - affine
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
