# velero-schedule-authentik.yaml
# Bi-monthly backup of the authentik namespace to B2.
#
# Covers: authentik-cnpg (Postgres) and the namespace's k8s objects (Ingress,
# SealedSecret, HelmRelease state). authentik-media/-templates are NFS and
# skipped — TrueNAS protects those.
# Keep authentik-cnpg in scope — CNPG's own snapshots stay in-cluster, so this
# is the only off-site copy of the identity database.
#
# Schedule: 5th + 20th, 03:00 UTC
# Retention: 21d TTL = last 2 restore points

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: authentik-bimonthly
  namespace: velero
spec:
  schedule: "0 3 5,20 * *"

  template:
    ttl: "504h0m0s"
    includedNamespaces:
      - authentik
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
