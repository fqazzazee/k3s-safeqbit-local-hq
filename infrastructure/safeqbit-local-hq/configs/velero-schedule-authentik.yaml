# velero-schedule-authentik.yaml
# Bi-monthly Velero backup of the authentik namespace to B2.
#
# Postgres data IS in this backup, contrary to what this comment claimed until
# 2026-08-17. Velero snapshots authentik-cnpg-2 on every run (~851MB in the
# DataUploads) because the PVC is claimed by the CNPG Cluster CR, not only by
# the pod. That is deliberate: the CNPG ScheduledBackup layer writes Longhorn
# VolumeSnapshots, which are in-cluster only, so this is the ONLY off-site copy
# of the identity database. Also catches the k8s objects (Ingress, SealedSecret,
# HelmRelease state). authentik-media/-templates are NFS and skipped by the
# volume policy — TrueNAS protects them.
#
# Schedule: 5th and 20th 03:00 UTC (unchanged). Spread across the month with
# other bi-monthly workloads so only one fires per day (avoids B2 cap spikes).
# Retention: 21 days -> keep the last 2 restore points (TTL between one ~15d
# interval and two). Tuned down from 90d on 2026-08-17, which held ~6 copies.
# Deliberately NOT the single copy originally requested: a sub-interval TTL
# would leave a window with zero off-site copies of identity after any one
# failed run.

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: authentik-bimonthly
  namespace: velero
spec:
  schedule: "0 3 5,20 * *"

  template:
    ttl: "504h0m0s"
    includedNamespaces:
      - authentik
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME workflow objects. Restoring these plants a stale
      # CertificateRequest that squats on the name cert-manager needs for the
      # next renewal, silently stalling it (vaultwarden-tls, 2026-07-18).
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skip NFS volumes (TrueNAS owns their protection) so backups complete
    # instead of PartiallyFailing. See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
