# velero-schedule-guacamole.yaml
# Monthly backup of the guacamole namespace to B2.
#
# Covers: guacamole-cnpg (Postgres — connections and vaulted credentials) and
# the namespace's k8s objects. guacamole-recordings is NFS and skipped.
# Keep guacamole-cnpg in scope — CNPG's own snapshots stay in-cluster, so this
# is the only off-site copy of the database.
#
# Schedule: 10th, 04:30 UTC
# Retention: 45d TTL = last 2 restore points

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: guacamole-monthly
  namespace: velero
spec:
  schedule: "30 4 10 * *"

  template:
    ttl: "1080h0m0s"
    includedNamespaces:
      - guacamole
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
