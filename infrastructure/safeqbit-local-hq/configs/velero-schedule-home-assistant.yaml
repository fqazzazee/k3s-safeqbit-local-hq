# velero-schedule-home-assistant.yaml
# Bi-weekly backup of the home-assistant namespace to B2.
#
# Covers: home-assistant-config — the entire HA state: integration credentials
# and entity registry (.storage/), configuration.yaml + packages, automations,
# dashboards, and the recorder SQLite DB. There is no external database, so
# this PVC is the whole workload.
#
# Schedule: 1st + 15th + 29th, 06:00 UTC (*/14 stutters at month end)
# Retention: 28d TTL = last 2 restore points (briefly 3 around month end)

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: home-assistant-biweekly
  namespace: velero
spec:
  schedule: "0 6 */14 * *"

  template:
    ttl: "672h0m0s"   # 28 days -> keep last 2 bi-monthly backups
    includedNamespaces:
      - home-assistant
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
