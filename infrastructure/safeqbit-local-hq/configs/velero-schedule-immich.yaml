# velero-schedule-immich.yaml
# Bi-monthly backup of the immich namespace to B2.
#
# Covers: immich-postgres-data and immich-config. Immich's postgres is a plain
# Deployment, not CNPG, so there is no snapshot layer beneath this — the PVC
# snapshot is crash-consistent and postgres replays WAL on restore.
# Skipped: photo library and import/export (NFS, TrueNAS's job) and
# immich-model-cache (velero.io/exclude-from-backup — re-downloadable models).
#
# Schedule: 1st + 16th, 03:30 UTC
# Retention: 60d

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: immich-bimonthly
  namespace: velero
spec:
  schedule: "30 3 1,16 * *"

  template:
    ttl: "1440h0m0s"   # 60 days
    includedNamespaces:
      - immich
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
