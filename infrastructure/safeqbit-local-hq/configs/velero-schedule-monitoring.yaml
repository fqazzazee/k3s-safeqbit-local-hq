# velero-schedule-monitoring.yaml
# Bi-monthly backup of the monitoring namespace to B2.
#
# Covers: grafana-cnpg (Postgres — the bulk of this backup), the alertmanager
# PVCs, and the namespace's k8s objects.
# Skipped: the Grafana NFS PVC (plugins/scratch, rebuildable) and the 40Gi
# Prometheus TSDB (capacity>=20Gi rule — metrics history is accepted DR loss).
# Keep grafana-cnpg in scope — CNPG's own snapshots stay in-cluster, so this is
# the only off-site copy of Grafana's database.
#
# Schedule: 9th + 24th, 03:00 UTC
# Retention: 21d TTL = last 2 restore points

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: monitoring-bimonthly
  namespace: velero
spec:
  schedule: "0 3 9,24 * *"

  template:
    ttl: "504h0m0s"
    includedNamespaces:
      - monitoring
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
