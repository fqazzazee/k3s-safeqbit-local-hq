# velero-schedule-netbox.yaml
# Bi-weekly backup of the netbox namespace to B2.
#
# Covers: netbox-cnpg (Postgres), netbox-redis-tasks, SealedSecrets, manifests.
# netbox-media/-reports/-scripts are NFS and skipped — TrueNAS protects those.
# Keep netbox-cnpg in scope — CNPG's own snapshots stay in-cluster, so this is
# the only off-site copy of the IPAM database.
#
# Schedule: 4th + 19th, 03:00 UTC
# Retention: 21d TTL = last 2 restore points. This caps IPAM rollback at three
# weeks; raise to 2160h (90d) if that proves too short in practice.

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: netbox-biweekly
  namespace: velero
spec:
  schedule: "0 3 4,19 * *"

  template:
    ttl: "504h0m0s"
    includedNamespaces:
      - netbox
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
