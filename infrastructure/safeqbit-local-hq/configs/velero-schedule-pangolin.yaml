# velero-schedule-pangolin.yaml
# Monthly backup of the pangolin namespace to B2.
#
# Covers: pangolin-cnpg (Postgres — orgs, users, sites, resources, access
# policies, EE license registration), pangolin-gerbil-key (the WireGuard private
# key; losing it forces every Newt/Olm peer to re-handshake against a new server
# key), and the namespace's k8s objects. pangolin-letsencrypt is NFS, skipped.
# Keep pangolin-cnpg in scope — CNPG's own snapshots stay in-cluster, so this is
# the only off-site copy of the database.
#
# Schedule: 25th, 04:15 UTC
# Retention: 60d TTL = last 2 restore points

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pangolin-monthly
  namespace: velero
spec:
  schedule: "15 4 25 * *"

  template:
    ttl: "1440h0m0s"
    includedNamespaces:
      - pangolin
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
