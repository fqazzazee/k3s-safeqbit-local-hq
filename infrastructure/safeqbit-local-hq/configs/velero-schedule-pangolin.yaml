# velero-schedule-pangolin.yaml
# Monthly Velero backup of the pangolin namespace to B2.
#
# Postgres data IS in this backup, contrary to what this comment claimed until
# 2026-08-17. Velero snapshots pangolin-cnpg-1 on every run (~609MB in the
# DataUploads) because the PVC is claimed by the CNPG Cluster CR, not only by
# the pod. The CNPG ScheduledBackup layer only writes in-cluster Longhorn
# VolumeSnapshots, so this is the ONLY off-site copy of the DB that holds orgs,
# users, sites, resources, access policies and the EE license registration.
#
# Also catches: Gerbil's WireGuard private key PVC (losing it forces every
# Newt/Olm peer to re-handshake against a new server key), the Traefik ACME
# state, and the k8s objects.
#
# Schedule: 25th 04:15 UTC. Dropped from bi-monthly (11th + 26th) to monthly on
# 2026-08-17; moved to the 25th so it stops sharing the 11th/26th with
# passzilla, restoring one namespace to B2 per day (avoids B2 Class B spikes).
#
# Retention: 60 days -> keep the last 2 restore points. Velero retention is
# TTL-based (there is no native "keep N"), so the TTL sits between one monthly
# interval (28-31d) and two (59-62d).
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pangolin-monthly
  namespace: velero
spec:
  schedule: "15 4 25 * *"

  template:
    ttl: "1440h0m0s"
    includedNamespaces:
      - pangolin
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME workflow objects. Restoring these plants a stale
      # CertificateRequest that squats on the name cert-manager needs for the
      # next renewal, silently stalling it (vaultwarden-tls, 2026-07-18).
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skip NFS volumes (TrueNAS owns their protection) so backups complete
    # instead of PartiallyFailing. The pangolin-acme PVC is nfs-truenas.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
