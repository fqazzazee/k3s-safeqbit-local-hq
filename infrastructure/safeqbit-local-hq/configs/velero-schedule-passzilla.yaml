# velero-schedule-passzilla.yaml
# Bi-monthly backup of the passzilla namespace to B2.
#
# Covers: passzilla-db (RWO Longhorn — Rails SQLite), the SECRET_KEY_BASE
# SealedSecret, Deployment, Service, Ingress.
#
# Schedule: 11th + 26th, 03:00 UTC
# Retention: 28d

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: passzilla-bimonthly
  namespace: velero
spec:
  schedule: "0 3 11,26 * *"

  template:
    ttl: "672h0m0s"   # 28 days
    includedNamespaces:
      - passzilla
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
