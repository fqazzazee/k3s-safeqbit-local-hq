# velero-schedule-photoprism.yaml
# Bi-monthly backup of the photoprism namespace to B2.
#
# Covers: photoprism's metadata PVCs (Longhorn) and k8s objects. The photo
# library lives on static NFS PVs (import/originals/storage) and is skipped —
# Velero cannot snapshot NFS; TrueNAS's own snapshots protect it.
#
# Schedule: 13th + 28th, 03:00 UTC
# Retention: 60d

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: photoprism-bimonthly
  namespace: velero
spec:
  schedule: "0 3 13,28 * *"

  template:
    ttl: "1440h0m0s"   # 60 days
    includedNamespaces:
      - photoprism
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
