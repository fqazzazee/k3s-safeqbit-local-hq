# velero-schedule-pulse.yaml
# Bi-monthly Velero backup of the pulse namespace to B2.
#
# Covers: pulse-data PVC (Pulse's config, the *encrypted* target credentials —
# Proxmox API tokens, Docker agent tokens, k3s access — discovered nodes, alert
# config, and history), plus the PVC definition, Deployment, Service, Ingress,
# and the pulse-auth SealedSecret.
#
# There is no external database for Pulse and no declarative source for its
# target config — targets are added in the web UI after deploy and this PVC
# snapshot is the only backup of that configuration. If the volume is lost
# without this, every Proxmox / Docker / k3s target has to be re-added by hand.
#
# Schedule: 6th + 21st 05:00 UTC. Dropped from weekly on 2026-08-17 and moved
# onto free days in the day-of-month stagger (one namespace to B2 per day).
# Retention: 21 days -> keep the last 2 restore points (TTL between one ~15d
# interval and two). Tuned down from 60d/weekly, which held ~8.6 copies.
#
# SIZE WATCH: pulse-data is the largest single Velero payload in the cluster —
# 227MB on 2026-07-25, 967MB on 2026-08-17, on a 2Gi PVC. Nearly all of it is
# Pulse's own metrics history (metrics.db 536MB, resources 172MB, audit 103MB).
# Trimming retention in the Pulse UI is the real fix; cutting the backup cadence
# only slows the bleed. Re-check /data usage if this PVC nears full.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pulse-bimonthly
  namespace: velero
spec:
  schedule: "0 5 6,21 * *"

  template:
    ttl: "504h0m0s"
    includedNamespaces:
      - pulse
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME workflow objects. Restoring these plants a stale
      # CertificateRequest that squats on the name cert-manager needs for the
      # next renewal, silently stalling it (vaultwarden-tls, 2026-07-18).
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skip NFS volumes (TrueNAS owns their protection) so backups complete
    # instead of PartiallyFailing. See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
