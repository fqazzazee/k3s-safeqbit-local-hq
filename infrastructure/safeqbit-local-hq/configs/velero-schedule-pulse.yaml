# velero-schedule-pulse.yaml
# Bi-monthly backup of the pulse namespace to B2.
#
# Covers: pulse-data — Pulse's config, the encrypted target credentials
# (Proxmox / Docker / k3s tokens), discovered nodes, alert config and history,
# plus the k8s objects. Targets are added in the UI and not declared in Git, so
# this snapshot is their only record; without it every target must be re-added
# by hand.
#
# Schedule: 6th + 21st, 05:00 UTC
# Retention: 21d TTL = last 2 restore points
#
# SIZE: ~1.2GB used on pulse-data (0.9-1.3GB over the 30 days to
# 2026-11-08), almost all of it Pulse's tiered metrics store. The v6.1.1
# upgrade on 2026-07-25 stepped pulse-data from 228MB to ~1GB in a single day
# when that store arrived; since then it moves up and down rather than only
# growing. Retention is working — Pulse prunes every tier hourly. The PVC is
# 4Gi, so ~2.8GB of headroom remains.
#
# If it ever does need shrinking, the levers in order are: slow
# pvePollingInterval (10s, inflates the raw tier), then metricsRetentionMinuteHours
# (24h default, ~60% of all rows) in /data/system.json. See workbook.

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pulse-bimonthly
  namespace: velero
spec:
  schedule: "0 5 6,21 * *"

  template:
    ttl: "504h0m0s"
    includedNamespaces:
      - pulse
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
