# velero-schedule-uptime-kuma.yaml
# Weekly backup of the uptime-kuma namespace to B2.
#
# Covers: uptime-kuma-data — the SQLite DB holding all monitors, notifications,
# status pages and the admin login, plus the k8s objects. Monitors are
# configured in the UI and not declared in Git, so this snapshot is their only
# record.
#
# Schedule: Sundays 04:00 UTC
# Retention: 60d

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: uptime-kuma-weekly
  namespace: velero
spec:
  schedule: "0 4 * * 0"

  template:
    ttl: "1440h0m0s"   # 60 days
    includedNamespaces:
      - uptime-kuma
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
