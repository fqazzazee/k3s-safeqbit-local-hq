# velero-schedule-vaultwarden.yaml
# Bi-monthly backup of the vaultwarden namespace to B2.
#
# Covers: vaultwarden-data — an embedded SQLite DB, so this single
# crash-consistent snapshot captures both app state and password data. There is
# no CNPG layer for this workload.
#
# Schedule: 7th + 22nd, 03:00 UTC
# Retention: 180d — deliberately the longest in the cluster; the data is tiny
# and irreplaceable.

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: vaultwarden-bimonthly
  namespace: velero
spec:
  schedule: "0 3 7,22 * *"

  template:
    ttl: "4320h0m0s"   # 180 days
    includedNamespaces:
      - vaultwarden
    excludedResources:
      - events
      - events.events.k8s.io
      - pods
      - replicasets
      # One-shot ACME objects: restoring them plants a stale
      # CertificateRequest that stalls the next cert renewal.
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    # Skips NFS volumes (TrueNAS protects those). See velero-volume-policy.yaml.
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy

  paused: false
