# metallb.yaml
# MetalLB chart. Installs metallb-controller (1 Pod) and metallb-speaker
# (DaemonSet, one Pod per node). The chart ships the IPAddressPool, L2Advertisement,
# and BGPPeer CRDs which are needed before our pools.yaml can apply.

---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: 0.16.1                     # check `helm list -n metallb-system`
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 1h
  releaseName: metallb
  install:
    remediation:
      retries: 3
    crds: CreateReplace                   # IPAddressPool, L2Advertisement CRDs
  upgrade:
    remediation:
      retries: 3
    crds: CreateReplace
  values:
    # This cluster is pure L2 — one L2Advertisement, zero BGPPeers and zero
    # BGPAdvertisements — so it needs no BGP backend at all. Both of these are
    # pinned rather than left to the chart, because 0.16.0 moved the default
    # from one unused BGP backend to a different unused BGP backend:
    #
    #                        0.15.3   0.16.1 default   here
    #   speaker.frr.enabled   true        false        false
    #   frrk8s.enabled        false       true         false
    #
    # Left at 0.16.1's defaults this upgrade would have dropped the three idle
    # FRR sidecars (frr, reloader, frr-metrics) off every speaker pod and then
    # deployed a whole frr-k8s DaemonSet, controller and webhook in their
    # place. Same amount of unused machinery, differently spelled. Turning both
    # off instead leaves the speaker as a single container.
    #
    # Set frrk8s.enabled back to true ONLY if this cluster ever speaks BGP;
    # FRR mode is deprecated upstream as of 0.16.0, so frr-k8s is the way
    # forward if that day comes. The subchart is vendored inside the metallb
    # tarball, so enabling it needs no extra HelmRepository.
    speaker:
      frr:
        enabled: false
    frrk8s:
      enabled: false
    controller:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: metallb
                    app.kubernetes.io/component: controller
                topologyKey: kubernetes.io/hostname
