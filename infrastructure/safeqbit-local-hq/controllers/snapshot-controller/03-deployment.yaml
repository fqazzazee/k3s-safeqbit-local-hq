# infrastructure/safeqbit-local-hq/controllers/snapshot-controller/03-deployment.yaml
# The snapshot-controller Deployment, from external-snapshotter v8.6.0
# (deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml).
#
# TWO DELIBERATE DEVIATIONS from that upstream file:
#
# 1. The image is pinned to v8.6.0. Upstream's manifest at the v8.6.0 tag
#    still says v8.5.0 — they release the controller without bumping the tag
#    inside the example manifest. Read the release, not the YAML.
#
# 2. resources are set. Upstream ships `resources: {}`. Measured before
#    choosing these: both replicas sit at 1m CPU and 12-22Mi, so 256Mi is
#    roughly ten times the observed ceiling. Requests are deliberately low —
#    this is a watch-loop controller, not something that should reserve
#    capacity on three nodes.
#
# Everything else — two replicas, leader election, minReadySeconds, the
# rolling strategy — is upstream verbatim. The controller is a singleton by
# leader election, so the second replica is standby, and maxUnavailable: 1
# with maxSurge: 0 is what makes a rolling restart hand the lease over
# cleanly rather than running two active controllers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-controller
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: snapshot-controller
  minReadySeconds: 35
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snapshot-controller
    spec:
      serviceAccountName: snapshot-controller
      containers:
        - name: snapshot-controller
          image: registry.k8s.io/sig-storage/snapshot-controller:v8.6.0
          args:
            - "--v=5"
            - "--leader-election=true"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
